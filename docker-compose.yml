version: "3.9"

# Local dev stack for the scam-call detection backend. The Android app
# talks to the gateway only (see README.md for pointing the app at this
# stack); everything else is internal to the `scamnet` network.
#
# All Rust/Python services share backend/proto/scam_detect.proto, so every
# build context below is `./backend` (not the per-service directory) with
# an explicit `dockerfile:` pointing at the service's Dockerfile.

networks:
  scamnet:
    driver: bridge

services:
  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_BIND_ADDR: "0.0.0.0:8080"
      AGGREGATOR_ADDR: "http://aggregator:50052"
      URGENCY_EN_ADDR: "http://urgency_en:50051"
      MONEY_EN_ADDR: "http://money_en:50051"
      IMPERSONATION_EN_ADDR: "http://impersonation_en:50051"
      URGENCY_ZH_ADDR: "http://urgency_zh:50051"
      MONEY_ZH_ADDR: "http://money_zh:50051"
      IMPERSONATION_ZH_ADDR: "http://impersonation_zh:50051"
      # 2 s promise to the phone: workers 1400 ms + aggregator 550 ms (Redis + the BERT second opinion)
      WORKER_TIMEOUT_MS: "1400"
      AGGREGATOR_TIMEOUT_MS: "550"
      # caller lines per call sent along for BERT (0 = never send text to the aggregator)
      BERT_CONTEXT_LINES: "5"
      # Workstream B: POST /v1/call/end waits this long for the aggregator's end-of-call review + clean-up
      # (above AGG_END_REVIEW_TIMEOUT_MS; the phone waits up to 3 s)
      END_CALL_TIMEOUT_MS: "2000"
      # Workstream H: POST /v1/report goes to the review service (the phone never reaches it directly)
      REVIEW_URL: "http://review:8090"
      # Workstream G.3: POST /v1/verify (the app's Hybrid mode) asks BERT about 5 masked caller lines.
      # Empty = verify off (503); the phone then keeps its own answer.
      BERT_ADDR: "${BERT_ADDR-http://bert:50051}"
      VERIFY_TIMEOUT_MS: "1200"
    depends_on:
      - aggregator
      - urgency_en
      - money_en
      - impersonation_en
      - urgency_zh
      - money_zh
      - impersonation_zh
    networks:
      - scamnet

  # Call memory for the aggregator (call:<call_id>, calllog:<call_id>), so any aggregator copy can handle
  # any line and restarting the aggregator mid-call loses nothing.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - scamnet

  aggregator:
    build:
      context: ./backend
      dockerfile: aggregator/Dockerfile
    environment:
      AGGREGATOR_GRPC_ADDR: "0.0.0.0:50052"
      AGGREGATOR_HTTP_ADDR: "0.0.0.0:8082"
      REDIS_URL: "redis://redis:6379"
      # Decision rules (see README "Aggregator timing policy"). These are the defaults; change and
      # `docker compose up -d aggregator` to tune without rebuilding.
      AGG_W_URGENCY: "0.3333"
      AGG_W_MONEY: "0.3333"
      AGG_W_IMPERSONATION: "0.3333"
      AGG_SCAM_THRESHOLD: "0.6"
      AGG_UNSURE_THRESHOLD: "0.45"
      AGG_WINDOW_LINES: "6"
      AGG_WARMUP_SECS: "15"
      AGG_WARMUP_OVERRIDE: "0.9"
      AGG_SCAM_STREAK: "2"
      AGG_MONEY_RULE: "0.7"
      AGG_MONEY_RULE_OTHER: "0.5"
      # money and the other signal must both be within this many recent caller lines (6 = whole window = the
      # original rule; 1 = same line; 2 = same or adjacent line). Try: AGG_MONEY_RULE_LINES=1 docker compose up -d aggregator
      AGG_MONEY_RULE_LINES: "${AGG_MONEY_RULE_LINES-6}"
      AGG_REASON_THRESHOLD: "0.5"
      AGG_MIN_QUORUM: "2"
      AGG_CALL_TTL_SECS: "3600"
      # Workstream B: when a call ends. No caller line for AGG_SILENCE_SECS -> the aggregator ends the call itself
      # (0 = off). The end-of-call review gets AGG_END_REVIEW_TIMEOUT_MS, then the live verdict is used. Late
      # lines are ignored for AGG_END_TOMBSTONE_SECS after the end.
      AGG_SILENCE_SECS: "${AGG_SILENCE_SECS-30}"
      AGG_SILENCE_CHECK_SECS: "5"
      AGG_END_REVIEW_TIMEOUT_MS: "1500"
      AGG_END_TOMBSTONE_SECS: "3600"
      # BERT second opinion (cascade, task 7.4). Empty BERT_ADDR = off, the aggregator then works as before.
      # `BERT_ADDR= docker compose up -d aggregator` switches the cascade off (fast-only run for 7.5)
      BERT_ADDR: "${BERT_ADDR-http://bert:50051}"
      BERT_TIMEOUT_MS: "300"
      AGG_BERT_WEIGHT: "0.5"   # final = 0.5 * fast vote + 0.5 * BERT
      AGG_BERT_VETO: "${AGG_BERT_VETO-0}"   # 0 = BERT can't cancel the money rule (recall first); see README
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - scamnet

  urgency_en:
    build:
      context: ./backend
      dockerfile: workers/urgency_en/Dockerfile
    environment:
      PORT: "50051"
      # Workstream H.8: set MODEL_VERSION (e.g. "v5") to load a released version from the review service's
      # model registry instead of the baked v4.
      MODEL_REGISTRY_URL: "http://review:8090"
      MODEL_VERSION: "${URGENCY_EN_MODEL_VERSION:-}"
    networks:
      - scamnet

  urgency_zh:
    build:
      context: ./backend
      dockerfile: workers/urgency_zh/Dockerfile
    environment:
      PORT: "50051"
    networks:
      - scamnet

  money_en:
    build:
      context: ./backend
      dockerfile: workers/money_en/Dockerfile
    environment:
      PORT: "50051"
    networks:
      - scamnet

  money_zh:
    build:
      context: ./backend
      dockerfile: workers/money_zh/Dockerfile
    environment:
      PORT: "50051"
    networks:
      - scamnet

  impersonation_en:
    build:
      context: ./backend
      dockerfile: workers/impersonation_en/Dockerfile
    environment:
      PORT: "50051"
    networks:
      - scamnet

  impersonation_zh:
    build:
      context: ./backend
      dockerfile: workers/impersonation_zh/Dockerfile
    environment:
      PORT: "50051"
    networks:
      - scamnet

  # BERT second opinion (backend/workers/bert). The model is NOT in git: put the notebook's 3 files in
  # backend/workers/bert/model/ before building, or set MODEL_BASE_URL (e.g. in a .env file next to this file)
  # to the folder they were uploaded to. If BERT is down or slow, the aggregator decides without it.
  bert:
    build:
      context: ./backend
      dockerfile: workers/bert/Dockerfile
      args:
        MODEL_BASE_URL: "${MODEL_BASE_URL:-https://huggingface.co/gouthamsaravanan/csc3104-scam-bert/resolve/8fe16111564b97977b5526f9ca75ac4e60539bc2}"
        MODEL_SHA256: "${MODEL_SHA256:-dfbb28873dff42d3ef93d2872de2084becf5216b234330ff99d430cdbfde27c4}"
    environment:
      PORT: "50051"
      ORT_THREADS: "2"
      GRPC_THREADS: "2"
    networks:
      - scamnet

  # Workstream H: review queue + labelling page + model registry (backend/review). Internal only: the labelling
  # page is published on 127.0.0.1 so only this laptop can open it (http://127.0.0.1:8090/).
  review:
    build:
      context: ./backend
      dockerfile: review/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # LOCAL DEV ONLY default key, so `docker compose up` works with no setup. Kubernetes uses a random key
      # made by `learning.py ensure-key` and kept in a Secret. Set REVIEW_KEY in .env to use your own.
      REVIEW_KEY: "${REVIEW_KEY:-ZGV2LW9ubHkta2V5LW5vdC1mb3ItcmVhbC1kYXRhISE=}"
    volumes:
      - review-data:/data
    networks:
      - scamnet

volumes:
  review-data:
