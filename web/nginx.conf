# The web app on its own (scam/web image, Kubernetes): port 8080 behind the Ingress, which sends /api/ to the gateway.
# docker compose replaces this file with demo/compose-edge.conf, which serves the same paths plus the /api/ proxy.
server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    location / { index index.html; }
    # The apps' call scripts, listed as JSON for the page
    location /scripts/ { alias /usr/share/nginx/scripts/; autoindex on; autoindex_format json; }
    # Levels 2 and 3: the apps' on-device models (MobileBERT is ~26 MB: revalidated with its ETag, not re-sent)
    location /ondevice/ {
        types { application/json json; text/plain txt; application/octet-stream onnx; }
        add_header Cache-Control "no-cache";
    }
    # onnxruntime-web: its loader is an ES module (.mjs) and must be served as JavaScript
    location /vendor/ {
        types { application/javascript js mjs; application/wasm wasm; }
        add_header Cache-Control "public, max-age=86400";
    }
    location = /healthz { return 200 "ok"; }
}
