<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6650a4">
  <title>ScamGuard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ScamGuard web app: the phone apps' cloud mode (privacy level 1) in a browser, so the system can be tried
       without Android Studio or Xcode. Served by the compose "edge" (http://127.0.0.1:8088/) and by the Kubernetes
       Ingress (https://<laptop IP>:8443/). It calls the same gateway as the phone, at api/ on the same address.
       strings.json and learn.json are generated (tools/i18n/gen_strings.py, tools/learn/build_learn.py). -->
  <div id="phone">
    <main id="screen" aria-live="polite"></main>
    <nav id="tabs" aria-label="Main">
      <button data-tab="home"><span class="ico" aria-hidden="true">⌂</span><span class="lbl">Home</span></button>
      <button data-tab="dashboard"><span class="ico" aria-hidden="true">☰</span><span class="lbl">Dashboard</span></button>
      <button data-tab="settings"><span class="ico" aria-hidden="true">⚙</span><span class="lbl">Settings</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
