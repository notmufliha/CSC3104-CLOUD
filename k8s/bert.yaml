# The BERT second opinion: Deployment + Service + HPA (task 7.4 / 7.12).
#
#   kubectl apply -f k8s/bert.yaml        (image: build backend/workers/bert, see its README)
#
# The aggregator reaches it through the Service as BERT_ADDR=bert:50051. It is only called when the fast
# workers are unsure or alarmed, or for the spot check, so it needs far fewer replicas than the workers.
# Two replicas minimum, so losing a pod doesn't leave the cascade without BERT; the HPA adds more under load.
# Sizing, measured on Docker Desktop with the int8 model: 136 MB model, ~280-380 MiB RAM, p50 ~35 ms per BERT
# call, ~57% of a core at 20 lines/s in cascade mode.
# NOTE: gRPC keeps one connection, so this plain ClusterIP Service sends one aggregator's calls to one pod. The
# full cluster setup in demo/ (make_manifests.py, same replica counts) puts Envoy in front to spread the calls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bert
  labels:
    app: bert
    signal: bert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bert
  template:
    metadata:
      labels:
        app: bert
        signal: bert
    spec:
      containers:
        - name: bert
          image: scam-detect/bert:latest # TODO: real registry + tag (minikube: eval $(minikube docker-env) first)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: PORT
              value: "50051"
            - name: ORT_THREADS # ONNX threads per request; GRPC_THREADS x ORT_THREADS <= CPU limit
              value: "2"
            - name: GRPC_THREADS
              value: "2"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          # SERVING only after the model has loaded and answered a warm-up request. The startup probe allows up
          # to 60 s for that; readiness and liveness only start once it has passed.
          startupProbe:
            grpc:
              port: 50051
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bert
spec:
  selector:
    app: bert
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bert
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bert
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
