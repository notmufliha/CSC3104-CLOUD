[package]
name = "aggregator"
version = "0.1.0"
edition = "2021"
# Oldest Rust this builds with; the Dockerfile pins the same image and Cargo.lock pins every dependency.
rust-version = "1.90"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
redis = { version = "1.8", features = ["tokio-comp", "connection-manager", "script"] }

[build-dependencies]
tonic-build = "0.11"
