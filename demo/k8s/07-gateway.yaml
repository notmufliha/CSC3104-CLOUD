apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: scamguard
  labels: { app: gateway }
spec:
  replicas: 1   # MUST be 1 -- see the comment on GATEWAY_REPLICAS at the top of this file.
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: scam/gateway:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WORKER_TIMEOUT_MS
              value: "1400"
            - name: AGGREGATOR_TIMEOUT_MS
              value: "550"
            - name: BERT_CONTEXT_LINES
              value: "5"
            - name: END_CALL_TIMEOUT_MS
              value: "2000"
            - name: REVIEW_URL
              value: "http://review:8090"
            - name: VERIFY_TIMEOUT_MS
              value: "1200"
            - name: GATEWAY_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: AGGREGATOR_ADDR
              value: "envoy-lb:50067"
            - name: BERT_ADDR
              value: "envoy-lb:50068"
            - name: URGENCY_EN_ADDR
              value: "envoy-lb:50061"
            - name: MONEY_EN_ADDR
              value: "envoy-lb:50062"
            - name: IMPERSONATION_EN_ADDR
              value: "envoy-lb:50063"
            - name: URGENCY_ZH_ADDR
              value: "envoy-lb:50064"
            - name: MONEY_ZH_ADDR
              value: "envoy-lb:50065"
            - name: IMPERSONATION_ZH_ADDR
              value: "envoy-lb:50066"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: scamguard
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
