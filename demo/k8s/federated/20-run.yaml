apiVersion: v1
kind: Service
metadata:
  name: fl-server
  namespace: scamguard-fl
spec:
  type: ClusterIP
  selector: { app: fl-server }
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
---
# G.6: the Flower server. Runs the rounds, scores the gold sets each round (G.7), runs the release check (G.9),
# publishes a passing model (G.10), prints the results as one RESULT_JSON line, and exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: fl-server
  namespace: scamguard-fl
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: fl-server }
    spec:
      restartPolicy: Never
      containers:
        - name: fl-server
          image: scam/federated:demo
          imagePullPolicy: IfNotPresent
          command: ["python", "server.py"]
          ports:
            - containerPort: 8080
              name: grpc
          env:
            - { name: FL_ROUNDS, value: "10" }
            - { name: FL_PHONES, value: "10" }
            - { name: FL_NOISE, value: "0.0" }
            - { name: FL_CLIP, value: "10.0" }
            - { name: FL_INIT, value: "zeros" }
            - { name: FL_PUBLISH, value: "0" }
            - { name: REVIEW_URL, value: "http://review.scamguard.svc.cluster.local:8090" }
            - { name: FL_RESULTS, value: "/results" }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: results, mountPath: /results }
      volumes:
        - { name: results, emptyDir: {} }
---
# G.6: the simulated phones. Indexed Job: pod i gets JOB_COMPLETION_INDEX=i and trains on data slice i only.
apiVersion: batch/v1
kind: Job
metadata:
  name: fl-phones
  namespace: scamguard-fl
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 10
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: fl-phone }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: phone
          image: scam/federated:demo
          imagePullPolicy: IfNotPresent
          command: ["python", "client.py"]
          env:
            - { name: FL_SERVER, value: "fl-server.scamguard-fl.svc.cluster.local:8080" }
          resources:
            requests: { cpu: "50m", memory: "160Mi" }
            limits: { cpu: "500m", memory: "400Mi" }
