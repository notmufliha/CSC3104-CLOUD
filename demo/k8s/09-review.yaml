apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: review-data
  namespace: scamguard
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
  namespace: scamguard
  labels: { app: review }
spec:
  replicas: 1          # SQLite = one writer
  strategy:
    type: Recreate     # the volume is ReadWriteOnce: the old pod must let go of it first
  selector:
    matchLabels: { app: review }
  template:
    metadata:
      labels: { app: review }
    spec:
      containers:
        - name: review
          image: scam/review:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: REVIEW_KEY
              valueFrom:
                secretKeyRef: { name: review-key, key: key }
            - name: REVIEW_RETENTION_DAYS
              value: "30"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: review-data
---
apiVersion: v1
kind: Service
metadata:
  name: review
  namespace: scamguard
spec:
  type: ClusterIP
  selector: { app: review }
  ports:
    - name: http
      port: 8090
      targetPort: 8090
