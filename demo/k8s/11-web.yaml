ine\": \"Your call history stays on this phone.\",\n\"setup_data_title\": \"Your data\",\n\"setup_done_line\": \"Change these later in Settings.\",\n\"setup_done_title\": \"You're all set\",\n\"setup_family_line\": \"Someone you trust. During a scam warning you can call or message them with one tap. Kept only on this phone.\",\n\"setup_family_title\": \"Add a family contact\",\n\"setup_helper_family_line\": \"Usually you. During a scam warning they can call or message this person with one tap. Kept only on this phone.\",\n\"setup_helper_family_title\": \"Who should they call?\",\n\"setup_helper_line\": \"Choose what works best for your family member.\",\n\"setup_helper_title\": \"Their settings\",\n\"setup_leave_first\": \"You'll see it again next time.\",\n\"setup_leave_replay\": \"Nothing will change.\",\n\"setup_leave_title\": \"Leave setup?\",\n\"setup_more_about\": \"More about this\",\n\"setup_privacy_line\": \"Pick where calls are checked.\",\n\"setup_privacy_title\": \"Choose how calls are checked\",\n\"setup_rec_b1\": \"Calls are checked online, the most accurate way\",\n\"setup_rec_b2\": \"Warnings are read aloud\",\n\"setup_rec_b3\": \"No words from your calls are kept\",\n\"setup_rec_line\": \"Most people choose these. You can change them later.\",\n\"setup_rec_title\": \"Use recommended settings?\",\n\"setup_server_line\": \"ScamGuard needs its server to check calls.\",\n\"setup_server_title\": \"Connect to the server\",\n\"setup_step\": \"Step {0} of {1}\",\n\"setup_welcome_line\": \"ScamGuard warns you during calls if the caller might be a scammer.\",\n\"setup_welcome_title\": \"Welcome to ScamGuard\",\n\"shared_1799\": \"Call 1799 ScamShield Helpline for help.\",\n\"shared_bank\": \"Call your bank on the number on your card. Ask them to block your card and stop payments.\",\n\"shared_line\": \"Do these now, one by one:\",\n\"shared_passwords\": \"Change your passwords, starting with your bank and email.\",\n\"shared_title\": \"If you already shared details\",\n\"sms_family\": \"ScamGuard: I may be on a scam call. Please call me.\",\n\"srv_encrypted\": \"Encrypted\",\n\"srv_info\": \"The address of the ScamGuard server. Emulator: 10.0.2.2 is your laptop (docker compose: :8080). Kubernetes: run demo/expose on the laptop; it prints https://<laptop Wi-Fi IP>:8443/api/. First time only: install demo/tls/ca.crt on this device. Without HTTPS, what callers say is sent as plain text.\",\n\"srv_info_ios\": \"The address of the ScamGuard server. Simulator: localhost is the Mac running docker compose (:8080 = gateway, :8088/api/ = edge). iPhone: use the Mac's Wi-Fi IP instead of 192.168.1.23 (on the Mac: ipconfig getifaddr en0). HTTPS (Kubernetes, demo/expose): install demo/tls/ca.crt on the iPhone as a profile (Settings → General → VPN & Device Management), then trust it in General → About → Certificate Trust Settings. Without HTTPS, what callers say is sent as plain text.\",\n\"srv_not_encrypted\": \"Not encrypted\",\n\"srv_presets\": \"Presets\",\n\"srv_title\": \"Connection\",\n\"status_cant_reach\": \"Can't reach\",\n\"status_checking\": \"Checking…\",\n\"status_connected\": \"Connected\",\n\"status_not_checked\": \"Not checked\",\n\"status_not_needed\": \"Not needed\",\n\"status_set_up_later\": \"Set up later\",\n\"style_page_line\": \"Your calls, family contact and PIN stay the same.\",\n\"style_simple\": \"Simple\",\n\"style_simple_line\": \"Bigger text, fewer buttons, warnings read aloud.\",\n\"style_standard\": \"Standard\",\n\"style_standard_line\": \"Charts, call history and all the settings.\",\n\"sum_checking\": \"Checking the whole call once more…\",\n\"sum_checking_line\": \"This takes a few seconds.\",\n\"sum_during\": \"During the call: {0}\",\n\"sum_during_phone\": \"During the call: {0} · Checked on this phone\",\n\"sum_during_unavailable\": \"During the call: {0} · Final check not available\",\n\"sum_family\": \"Family contact\",\n\"sum_no_lines\": \"No caller lines were flagged.\",\n\"sum_pin\": \"PIN\",\n\"sum_privacy\": \"How calls are checked\",\n\"sum_server\": \"Connection\",\n\"sum_triggered\": \"What triggered it\",\n\"summary_title\": \"Call summary\",\n\"tab_dashboard\": \"Dashboard\",\n\"tab_family\": \"For family\",\n\"tab_home\": \"Home\",\n\"tab_settings\": \"Settings\",\n\"text_large\": \"Large\",\n\"text_normal\": \"Normal\",\n\"text_normal_line\": \"The same size as your phone's other apps.\",\n\"text_size_sample\": \"This is how big the words will be.\",\n\"text_xlarge\": \"Extra large\",\n\"tip_app_style\": \"Setting this up for a parent? Try Simple mode in Settings → App style.\",\n\"tour_bar_line\": \"Shows how risky the call is.\",\n\"tour_bar_title\": \"The risk bar\",\n\"tour_buttons_line\": \"Hang up. Then call your family or the 1799 ScamShield Helpline.\",\n\"tour_buttons_title\": \"What to do\",\n\"tour_chips_line\": \"Warning signs it heard light up.\",\n\"tour_chips_title\": \"Warning signs\",\n\"tour_dash_line\": \"Your safety at a glance.\",\n\"tour_dash_title\": \"Your dashboard\",\n\"tour_pick_line\": \"Choose which pretend call to play.\",\n\"tour_pick_title\": \"Pick a call\",\n\"tour_practice_line\": \"Tap here to hear a pretend scam call. Nothing is real.\",\n\"tour_practice_title\": \"Practice call\",\n\"tour_privacy_line\": \"Change privacy anytime.\",\n\"tour_privacy_title\": \"Privacy level\",\n\"tour_progress\": \"{0} of {1}\",\n\"tour_red_line\": \"If a call may be a scam, the screen turns red and the warning is read aloud.\",\n\"tour_red_line_full\": \"Hang up when you see this.\",\n\"tour_red_title\": \"The red warning\",\n\"tour_scam_line\": \"Plays a pretend scam call.\",\n\"tour_scam_title\": \"Try a demo call\",\n\"warn_call_ended\": \"The call has ended.\",\n\"warn_do_details\": \"Do not give any personal details.\",\n\"warn_do_money\": \"Do not send any money.\",\n\"warn_do_otp\": \"Do not give your OTP.\",\n\"warn_msg_earlier\": \"This call had signs of a scam earlier on.\",\n\"warn_msg_general\": \"This call sounds like a scam.\",\n\"warn_msg_money\": \"They asked you to send money. Banks and police never do this.\",\n\"warn_msg_official\": \"They say they are from the police, a bank or the government. Real officers never ask for money or codes on the phone.\",\n\"warn_msg_otp\": \"They asked for your OTP. Banks and police never do this.\",\n\"warn_msg_rush\": \"They are rushing you to act now. Real organisations give you time to check.\",\n\"warn_msg_several\": \"This call has several signs of a scam.\",\n\"warn_spoken\": \"This may be a scam. {0} Hang up now.\",\n\"warn_title\": \"This may be a scam\",\n\"weekly_calls_many\": \"{0} calls checked.\",\n\"weekly_calls_one\": \"1 call checked.\",\n\"weekly_careful_many\": \"{0} 'be careful'.\",\n\"weekly_careful_one\": \"1 'be careful'.\",\n\"weekly_end\": \"Stay safe! Call 1799 if unsure.\",\n\"weekly_head\": \"ScamGuard weekly summary ({0}):\",\n\"weekly_line\": \"A short note for your family about this week's calls. It has no phone numbers and nothing the callers said.\",\n\"weekly_none\": \"no calls checked this week.\",\n\"weekly_preview\": \"This is what will be shared:\",\n\"weekly_r_imp\": \"pretended to be an official\",\n\"weekly_r_money\": \"asked for money or a code\",\n\"weekly_r_other\": \"sounded like a scam\",\n\"weekly_r_urgency\": \"rushed you\",\n\"weekly_reminder\": \"Weekly reminder\",\n\"weekly_reminder_denied\": \"Notifications are off for ScamGuard. Turn them on in your phone's Settings to get the reminder.\",\n\"weekly_reminder_line\": \"Once a week, a note on this phone reminds you to share the summary.\",\n\"weekly_scam_many\": \"{0} scam calls warned ({1}).\",\n\"weekly_scam_one\": \"1 scam call warned ({0}).\",\n\"weekly_scam_zero\": \"No scam calls.\",\n\"weekly_title\": \"Weekly summary\",\n\"what_does_this_mean\": \"What does this mean?\",\n\"who_family\": \"An older family member\",\n\"who_family_line\": \"Set it up for them, with you as their family contact.\",\n\"who_line\": \"You can change this later in Settings.\",\n\"who_me\": \"Me\",\n\"who_me_line\": \"The full app, with charts and all the settings.\",\n\"who_pick_one\": \"Choose one of the three to go on.\",\n\"who_simpler\": \"Me, but simpler\",\n\"who_simpler_line\": \"Bigger text and fewer buttons.\",\n\"who_title\": \"Who will use this phone?\"\n}\n"
  style.css: "/* ScamGuard web app: the phone apps' colours (Material purple, the same safe / careful / scam colours) and sizes\n   (big buttons at least 56 px, 64 px for the main ones; text size Normal / Large / Extra large as in the apps). */\n:root {\n  --bg: #fffbfe; --surface: #f4eff4; --card: #f3edf7; --text: #1c1b1f; --muted: #49454f; --outline: #79747e;\n  --primary: #6750a4; --on-primary: #ffffff; --primary-soft: #eaddff; --on-primary-soft: #21005d;\n  --safe: #2b7530; --warn: #b26a00; --scam: #c62828; --grey: #6d6d6d;\n  --bubble-caller: #ece6f0; --bubble-me: #e8def8;\n  font-size: 16px;\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #141218; --surface: #1d1b20; --card: #2b2930; --text: #e6e1e5; --muted: #cac4d0; --outline: #938f99;\n    --primary: #d0bcff; --on-primary: #381e72; --primary-soft: #4f378b; --on-primary-soft: #eaddff;\n    --safe: #81c784; --warn: #ffb74d; --scam: #ff8a80; --grey: #bdbdbd; --bubble-caller: #36343b; --bubble-me: #4a4458;\n  }\n}\n:root[data-size=\"large\"] { font-size: 19px; }\n:root[data-size=\"xlarge\"] { font-size: 22px; }\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody {\n  background: var(--surface); color: var(--text);\n  font: 1rem/1.45 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  display: flex; justify-content: center;\n}\n#phone {\n  width: 100%; max-width: 520px; height: 100dvh; background: var(--bg); position: relative;\n  display: flex; flex-direction: column; box-shadow: 0 0 24px rgba(0,0,0,.12);\n}\n#screen { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }\n#tabs { display: flex; border-top: 1px solid var(--outline); background: var(--surface); }\n#tabs[hidden] { display: none; }\n#tabs button {\n  flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 0 10px; font: inherit; font-size: .85rem;\n  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-height: 64px;\n}\n#tabs button .ico { font-size: 1.3rem; line-height: 1.8rem; width: 64px; border-radius: 16px; }\n#tabs button.on { color: var(--text); font-weight: 600; }\n#tabs button.on .ico { background: var(--primary-soft); }\n\nh1 { font-size: 1.75rem; font-weight: 700; margin: 4px 0 0; outline: none; }\nh2 { font-size: 1.15rem; font-weight: 600; margin: 8px 0 0; }\np { margin: 0; }\nul, ol { margin: 6px 0 0; padding-left: 1.3em; }\nli { margin: 4px 0; }\n.muted { color: var(--muted); }\n.small { font-size: .85rem; }\n.strong { font-weight: 600; }\n.block { display: block; }\n.center { text-align: center; align-self: center; }\n.right { text-align: right; }\n.col { display: flex; flex-direction: column; gap: 12px; }\nhr { border: 0; border-top: 1px solid var(--outline); margin: 4px 0; width: 100%; opacity: .5; }\na { color: var(--primary); }\n:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }\n\nbutton.btn, a.btn {\n  font: inherit; font-weight: 600; min-height: 56px; padding: 8px 20px; border-radius: 32px; cursor: pointer;\n  border: 2px solid var(--outline); background: none; color: var(--primary); text-align: center;\n  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;\n  transition: transform .1s;\n}\nbutton.btn:active, a.btn:active { transform: scale(.97); }\n@media (prefers-reduced-motion: reduce) { button.btn:active, a.btn:active { transform: none; } * { animation: none !important; transition: none !important; } }\n.btn.fill { background: var(--primary); color: var(--on-primary); border-color: var(--primary) !important; }\n.btn.red { background: var(--scam); color: #fff; border-color: var(--scam) !important; }\n.btn.green { background: var(--safe); color: #fff; border-color: var(--safe) !important; }\n.btn.outline { border-color: var(--primary); }\n.btn.red-outline { border-color: var(--scam); color: var(--scam); }\n.btn.wide { width: 100%; }\n.btn.big { min-height: 64px; font-size: 1.05rem; }\n.btn:disabled { opacity: .45; cursor: default; }\n@media (prefers-color-scheme: dark) { .btn.red, .btn.green { color: #1c1b1f; } }\nbutton.link { border: 0; background: none; color: var(--primary); font: inherit; padding: 10px 0; min-height: 48px; cursor: pointer; align-self: flex-start; text-decoration: underline; }\nbutton.link.center { align-self: center; }\n.row { display: flex; gap: 8px; align-items: center; }\n.row > .grow, .grow { flex: 1; min-width: 0; }\n.card { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 0; color: inherit; font: inherit; text-align: left; }\n.card.row { flex-direction: row; }\n.card.click { cursor: pointer; min-height: 64px; }\n.card.click:hover { outline: 2px solid var(--primary); }\n.note { border-radius: 12px; padding: 10px 12px; background: var(--surface); }\n.banner { border-radius: 16px; padding: 14px; border: 2px solid; display: flex; gap: 12px; align-items: flex-start; }\n\n.badge { display: flex; gap: 12px; align-items: center; font-weight: 600; }\n.badge.big { font-size: 1.6rem; }\n.badge-dot { width: 2.2rem; height: 2.2rem; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; background: var(--primary); }\n.badge.big .badge-dot { width: 3rem; height: 3rem; }\n.badge-dot.small { width: 1.8rem; height: 1.8rem; }\n@media (prefers-color-scheme: dark) { .badge-dot { color: #1c1b1f; } }\n\n.status { display: flex; gap: 14px; align-items: center; border: 2px solid var(--outline); border-radius: 20px; padding: 16px; }\n.status.ok { border-color: var(--safe); } .status.ok .badge-dot { background: var(--safe); }\n.status.bad { border-color: var(--grey); } .status.bad .badge-dot { background: var(--grey); }\n.status-title { font-weight: 700; font-size: 1.25rem; }\n\n.learn-card { display: flex; gap: 14px; align-items: center; background: var(--primary-soft); color: var(--on-primary-soft); border: 0;\n  border-radius: 20px; padding: 18px 16px; font: inherit; text-align: left; cursor: pointer; min-height: 64px; }\n.learn-card .grow > span { display: block; }\n.lc-title { font-weight: 700; font-size: 1.2rem; }\n\n.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; text-align: center; color: var(--muted); }\n.empty-ico { width: 3.5rem; height: 3.5rem; border-radius: 50%; background: var(--primary-soft); display: grid; place-items: center; font-size: 1.5rem; }\n.hero-text { font-size: 1.4rem; font-weight: 700; }\n.big-line { font-size: 1.2rem; font-weight: 600; }\n.quote-big { font-size: 1.15rem; }\n.preview { white-space: pre-wrap; }\n.callrow { align-items: center; }\n\n.chips { display: flex; flex-wrap: wrap; gap: 8px; }\n.chip { border: 1px solid var(--outline); border-radius: 8px; padding: 6px 12px; color: var(--muted); background: none; font: inherit; font-size: .9rem; }\nbutton.chip { cursor: pointer; min-height: 48px; }\n.chip.on { border-color: var(--scam); color: var(--scam); font-weight: 600; }\nbutton.chip.sel { border-color: var(--primary); color: var(--text); background: var(--primary-soft); }\n.tag { font-size: .75rem; border-radius: 6px; padding: 1px 6px; color: #fff; font-weight: 700; }\n\n/* incoming call */\n.ringing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 48px 0 32px; text-align: center; }\n.avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--bubble-me); display: grid; place-items: center; font-size: 44px; margin: 24px auto 12px; animation: pulse 1.4s infinite; }\n@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent); } 50% { box-shadow: 0 0 0 18px transparent; } }\n.round { width: 76px; height: 76px; border-radius: 50%; border: 0; color: #fff; font-size: 28px; cursor: pointer; }\n.answer-row { display: flex; gap: 72px; justify-content: center; }\n.answer-row div { display: flex; flex-direction: column; align-items: center; gap: 6px; }\n\n/* in call */\n.riskbar { display: flex; flex-direction: column; gap: 6px; }\n.track { height: 16px; border-radius: 8px; background: var(--surface); overflow: hidden; border: 1px solid var(--outline); }\n.bar { height: 100%; transition: width .45s, background-color .45s; }\n.chat { display: flex; flex-direction: column; gap: 8px; }\n.bubble { max-width: 88%; padding: 10px 14px; border-radius: 18px; background: var(--bubble-caller); border: 2px solid transparent; }\n.bubble.me { align-self: flex-end; background: var(--bubble-me); }\n.bubble.flagged { border-color: var(--scam); }\n.bubble.risky { border-color: var(--warn); }\n.bubble .who { font-size: .8rem; color: var(--muted); }\n.bubble .state { font-size: .8rem; color: var(--muted); }\n.bubble .flags { font-size: .8rem; color: var(--scam); font-weight: 600; }\n.sticky-bottom { position: sticky; bottom: -16px; background: var(--bg); padding: 8px 0 16px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }\n\n/* the red warning: covers the call screen, as in the apps */\n.warning { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; background: #b71c1c; color: #fff; padding: 24px 20px; overflow-y: auto;\n  display: flex; flex-direction: column; gap: 14px; z-index: 5; animation: warnIn .28s ease-out; }\n@keyframes warnIn { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }\n.warning h1 { font-size: 2rem; }\n.warn-icon { font-size: 3rem; }\n.warn-msg { font-size: 1.25rem; }\n.warn-do { font-size: 1.3rem; font-weight: 700; }\n.warn-actions { margin-top: auto; }\n.btn.white { background: #fff; color: #b71c1c; border-color: #fff !important; }\n.btn.outline-white { color: #fff; border-color: #fff !important; }\nbutton.link.white { color: #fff; }\n\n/* bottom sheet on the summary */\n.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 8; }\n.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 520px; max-height: 85dvh; overflow-y: auto;\n  background: var(--bg); border-radius: 28px 28px 0 0; padding: 20px 16px 24px; z-index: 9; display: flex; flex-direction: column; gap: 12px; }\n.spinner { width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--primary-soft); border-top-color: var(--primary); animation: spin 1s linear infinite; }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* settings */\nlabel.field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }\ninput[type=text], input[type=tel] {\n  font: inherit; font-weight: 400; color: var(--text); background: var(--bg); border: 2px solid var(--outline); border-radius: 12px; padding: 14px; min-height: 56px;\n}\n.choice { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 2px solid var(--outline); border-radius: 16px; cursor: pointer; }\n.choice.on { border-color: var(--primary); background: var(--primary-soft); color: var(--on-primary-soft); }\n.choice.on .muted { color: inherit; }\n.choice.off { opacity: .55; cursor: default; }\n.choice input { width: 1.3rem; height: 1.3rem; accent-color: var(--primary); margin-top: 2px; }\n.switch { display: flex; gap: 12px; align-items: center; min-height: 56px; }\n.switch input { width: 48px; height: 28px; flex: none; accent-color: var(--primary); }\nsvg.chart { width: 100%; height: 180px; background: var(--card); border-radius: 16px; }\n\n/* Simple mode: bigger, fewer details */\n:root[data-simple=\"yes\"] h1 { font-size: 2rem; }\n"
