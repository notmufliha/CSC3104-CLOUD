apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scamguard
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      annotations:
        # a changed page changes this hash, so `kubectl apply` rolls the pod and it serves the new image
        scamguard/files-hash: "842611169134"
    spec:
      containers:
        - name: nginx
          image: scam/web:demo
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: scamguard
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: scamguard
spec:
  ingressClassName: nginx
  tls:
    - hosts: [scamguard.test]
      secretName: gateway-tls
  rules:
    - host: scamguard.test
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
