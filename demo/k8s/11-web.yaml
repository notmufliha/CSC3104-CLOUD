apiVersion: v1
kind: ConfigMap
metadata:
  name: web-files
  namespace: scamguard
data:
  app.js: "// ScamGuard web app: the Android app's cloud mode (privacy level 1) in a browser. Same gateway calls\n// (POST v1/utterance, v1/call/end, v1/report, GET healthz), same screens and the same rules for colours, reasons\n// and history. Kept in step with android-app/.../ui/CallViewModel.kt, logic/Risk.kt, logic/Mask.kt.\n// The call scripts are the app's own (android-app/app/src/main/assets/scripts), served at scripts/.\n// History stays in this browser (localStorage), like the phone's on-device database.\n\"use strict\";\n\n// ---------------------------------------------------------------- constants (as in the app)\n\nconst SIGNALS = [\"urgency\", \"money\", \"impersonation\"];\nconst SIGNAL_ON = 0.5;                 // Risk.SIGNAL_ON\nconst DEFAULT_DELAY_MS = 1500;\nconst FINAL_REVIEW_WAIT_MS = 3000;\nconst UNSURE_LINE = 0.45, SCAM_LINE = 0.6;   // the aggregator's default thresholds, drawn on the chart\nconst SCAMSHIELD_URL = \"https://www.scamshield.gov.sg/\";\nconst COLORS = { GREEN: \"var(--safe)\", YELLOW: \"var(--warn)\", RED: \"var(--scam)\", ERROR: \"var(--grey)\", LISTENING: \"var(--grey)\" };\nconst LABELS = { LISTENING: \"Listening…\", GREEN: \"Looks safe so far\", YELLOW: \"Suspicious\", RED: \"Likely scam\", ERROR: \"Could not check\" };\nconst REASON_TEXT = {\n  money: \"Asked for your OTP or money\",\n  impersonation: \"Claims to be police, a bank or the government\",\n  urgency: \"Pressuring you to act now\",\n  bert: \"The conversation as a whole sounds like a scam\",\n  several: \"Several small warning signs together\",\n  none: \"No warning signs\",\n  server_not_reached: \"Server not reached\",\n  no_lines: \"Ended before any line was checked\",\n};\n\n// ---------------------------------------------------------------- storage (every access guarded)\n\nconst store = {\n  get(key, fallback) {\n    try { const v = localStorage.getItem(\"scamguard.\" + key); return v === null ? fallback : JSON.parse(v); }\n    catch { return fallback; }\n  },\n  set(key, value) { try { localStorage.setItem(\"scamguard.\" + key, JSON.stringify(value)); } catch { /* private mode */ } },\n};\n\n/** \"api/\" (same address as this page) unless Settings saved another. */\nfunction gatewayUrl() { return store.get(\"gatewayUrl\", \"api/\"); }\nfunction normalize(url) {\n  let u = (url || \"\").trim() || \"api/\";\n  // \"192.168.1.23:8080\" or \"host.example:8443/api\" -> add http://; \"api/\" or \"/api/\" stay relative to this page\n  if (!/^https?:\\/\\//i.test(u) && /^[\\w.-]+(:\\d+)(\\/|$)|^\\d+\\.\\d+\\.\\d+\\.\\d+/.test(u)) u = \"http://\" + u;\n  if (!u.endsWith(\"/\")) u += \"/\";\n  return u;\n}\n\n// ---------------------------------------------------------------- risk rules (logic/Risk.kt)\n\nfunction level(verdict, error) {\n  if (verdict === \"SCAM\") return \"RED\";\n  if (verdict === \"UNSURE\") return \"YELLOW\";\n  if (error) return \"ERROR\";\n  if (verdict === \"SAFE\") return \"GREEN\";\n  return \"LISTENING\";\n}\nconst SEVERITY = { LISTENING: 0, GREEN: 1, ERROR: 2, YELLOW: 3, RED: 4 };\nconst litSignals = (scores) => SIGNALS.filter((s) => (scores?.[s] ?? 0) >= SIGNAL_ON);\nconst chipLabel = (s) => ({ urgency: \"Urgency\", money: \"Money / OTP\", impersonation: \"Impersonation\" }[s] || s);\nfunction reasonFor(lit, texts) {\n  const all = texts.join(\" \").toLowerCase();\n  if (lit.includes(\"money\") && (all.includes(\"otp\") || all.includes(\"one-time\") || all.includes(\"验证码\"))) return \"asking for your OTP\";\n  if (lit.includes(\"money\")) return \"asking you to transfer money\";\n  if (lit.includes(\"impersonation\")) return \"pretending to be an official (police, bank, government)\";\n  if (lit.includes(\"urgency\")) return \"pressuring you to act right now\";\n  return \"several small warning signs together\";\n}\nfunction actionFor(lit) {\n  if (lit.includes(\"money\")) return \"Hang up and call your bank on the number on your card.\";\n  if (lit.includes(\"impersonation\")) return \"Hang up and call the agency back on its official number.\";\n  return \"Don't share personal details. Real organisations give you time to check.\";\n}\nfunction bannerFor(lvl, lit, texts) {\n  if (lvl === \"RED\") return `Likely scam: ${reasonFor(lit, texts)}. ${actionFor(lit)}`;\n  if (lvl === \"YELLOW\") return `Be careful: ${reasonFor(lit, texts)}. ${actionFor(lit)}`;\n  if (lvl === \"ERROR\") return \"Could not check this call. The server can't be reached — this does NOT mean it is safe.\";\n  return null;\n}\n\n// ---------------------------------------------------------------- masking (logic/Mask.kt, backend/review/mask.py)\n\nconst Mask = (() => {\n  const email = /\\b[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+\\b/g;\n  const url = /\\b(?:https?:\\/\\/|www\\.)\\S+|\\b[\\w-]+\\.(?:com|sg|net|org|gov|io|co|my|cn)(?:\\/\\S*)?\\b/gi;\n  const money = /(?:(?:S?\\$|SGD|USD|RM|MYR|RMB|¥|€|£)\\s?\\d[\\d,]*(?:\\.\\d+)?(?:\\s?(?:k|m|million|thousand))?)|(?:\\d[\\d,]*(?:\\.\\d+)?\\s?(?:dollars?|sgd|bucks|元|块))/gi;\n  const id = /\\b[STFGM]\\d{7}[A-Z]\\b/gi;\n  const phone = /(?<![\\w])\\+?\\d[\\d\\s-]{6,}\\d(?![\\w])/g;\n  const digits = /\\d+/g;\n  const TITLE = \"(?:[Oo]fficer|[Ii]nspector|[Ss]ergeant|[Mm]r|[Mm]rs|[Mm]s|[Mm]adam|[Dd]r|[Dd]octor)\\\\.?\";\n  const CUE = \"(?:[Mm]y name is|[Tt]his is|[Ii] am|[Ii]'m|[Ss]peaking with)\";\n  const name = new RegExp(`((?:\\\\b${CUE}\\\\s+(?:${TITLE}\\\\s+)?|\\\\b${TITLE}\\\\s+))([A-Z][a-z]+(?:\\\\s+[A-Z][a-z]+)?)`, \"g\");\n  const nameZh = /(我叫|我姓)([一-鿿]{1,3})/g;\n  const notNames = new Set((\"police singapore dbs ocbc uob posb maybank citibank hsbc standard moh mom iras cpf ica spf \" +\n    \"customs immigration interpol the your a an calling from with here just not sorry sure fine okay ok very shopee \" +\n    \"lazada grab singtel starhub m1 dhl fedex ninja amazon apple microsoft google manager officer inspector sergeant \" +\n    \"madam sir doctor\").split(\" \"));\n  return (text) => {\n    let t = text.replace(email, \"[EMAIL_ADDRESS]\");\n    t = t.replace(url, \"[URL]\").replace(money, \"[MONEY_AMOUNT]\").replace(id, \"[NUMBER]\");\n    t = t.replace(phone, \"[PHONE_NUMBER]\").replace(digits, \"[NUMBER]\");\n    t = t.replace(name, (_, cue, who) => cue + (notNames.has(who.split(\" \")[0].toLowerCase()) ? who : \"[PERSON_NAME]\"));\n    return t.replace(nameZh, (_, cue) => cue + \"[PERSON_NAME]\");\n  };\n})();\n\n// ---------------------------------------------------------------- gateway\n\nasync function api(path, body, timeoutMs = 4000, base = gatewayUrl()) {\n  const ctrl = new AbortController();\n  const timer = setTimeout(() => ctrl.abort(), timeoutMs);\n  try {\n    const resp = await fetch(normalize(base) + path, {\n      method: body === undefined ? \"GET\" : \"POST\",\n      headers: body === undefined ? {} : { \"Content-Type\": \"application/json\" },\n      body: body === undefined ? undefined : JSON.stringify(body),\n      signal: ctrl.signal,\n    });\n    let json = null;\n    try { json = await resp.json(); } catch { /* not JSON */ }\n    return { ok: resp.ok, status: resp.status, json };\n  } finally { clearTimeout(timer); }\n}\n\n// ---------------------------------------------------------------- scripts\n\nlet scripts = [];\nasync function loadScripts() {\n  try {\n    const list = await (await fetch(\"scripts/\")).json();          // nginx autoindex (JSON)\n    const names = list.map((f) => f.name).filter((n) => n.endsWith(\".json\")).sort();\n    scripts = (await Promise.all(names.map(async (file) => {\n      try {\n        const lines = await (await fetch(\"scripts/\" + file)).json();\n        const parts = file.replace(/\\.json$/, \"\").split(\"_\");\n        const title = parts.slice(3).join(\" \");\n        return {\n          file, kind: (parts[0] || \"unknown\").toLowerCase(),\n          lang: [\"en\", \"zh\"].includes(parts[1]) ? parts[1] : null,\n          title: title ? title[0].toUpperCase() + title.slice(1) : file,\n          lines: lines.filter((l) => l.text && l.text.trim()),\n        };\n      } catch { return null; }\n    }))).filter(Boolean);\n  } catch { scripts = []; }\n}\nconst isCaller = (l) => [\"caller\", \"speaker 1\", \"speaker1\", \"speaker_1\"].includes((l.speaker || \"\").trim().toLowerCase());\nlet lastRandom = null;\nfunction randomScript(kind) {\n  const pool = scripts.filter((s) => s.kind === kind);\n  const others = pool.filter((s) => s.file !== lastRandom);\n  const pick = (others.length ? others : pool)[Math.floor(Math.random() * (others.length || pool.length))];\n  lastRandom = pick?.file;\n  return pick;\n}\n\n// ---------------------------------------------------------------- state\n\nlet screen = \"home\";           // home | pick | paste | ringing | call | summary | dashboard | detail | settings\nlet call = null;               // the current call (see newCall)\nlet openCallId = null;\nlet pickFilter = { kind: null, lang: null };\n\nfunction newCall(script) {\n  return {\n    script, id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),\n    lines: [], verdict: null, combinedScore: null, callScores: {}, error: null, lastOutcomeSeq: 0,\n    scamAlert: false, alertShown: false, points: [], startedAt: 0, timers: [], ended: false,\n    reviewing: false, finalReview: null, reportResult: null, sending: false,\n  };\n}\nconst callLevel = (c) => level(c.verdict, c.error);\nconst flaggedTexts = (c) => c.lines.filter((l) => l.flags?.length).map((l) => l.text);\nfunction summaryLevel(c) {\n  const fr = c.finalReview;\n  const live = callLevel(c);\n  const fin = level(fr?.finalVerdict ?? c.verdict, c.error);\n  if (fr?.reviewed) return fin;\n  return SEVERITY[fin] >= SEVERITY[live] ? fin : live;\n}\n\n// ---------------------------------------------------------------- call lifecycle (CallViewModel.kt)\n\nfunction ring(script) { stopTimers(); call = newCall(script); go(\"ringing\"); }\n\nfunction answer() {\n  const c = call;\n  c.startedAt = Date.now();\n  go(\"call\");\n  let at = 0;\n  const sends = [];\n  c.script.lines.forEach((line, i) => {\n    at += line.delay_ms ?? DEFAULT_DELAY_MS;\n    c.timers.push(setTimeout(() => {\n      if (c.ended) return;\n      const seq = i + 1;\n      const caller = isCaller(line);\n      c.lines.push({ seq, isCaller: caller, text: line.text, flags: [], pending: caller, failed: false });\n      if (caller) sends.push(send(c, seq, line.text));\n      render();\n      if (i === c.script.lines.length - 1) {\n        // let the last answers arrive (up to 5 s), a moment to read the final state, then end\n        Promise.race([Promise.allSettled(sends), sleep(5000)]).then(() => sleep(1500)).then(() => endCall(c, \"script_finished\"));\n      }\n    }, at));\n  });\n  if (!c.script.lines.length) endCall(c, \"script_finished\");\n}\n\nasync function send(c, seq, text) {\n  let r;\n  try {\n    r = await api(\"v1/utterance\", { call_id: c.id, seq, speaker: \"caller\", text, ...(c.script.lang ? { lang: c.script.lang } : {}) });\n  } catch { return markError(c, seq, \"Could not reach the server\"); }\n  if (c.ended) return;\n  if (!r.ok) return markError(c, seq, `Server error ${r.status}`);\n  if (!r.json) return markError(c, seq, \"Empty answer from server\");\n  applyAnswer(c, seq, r.json);\n}\n\nfunction applyAnswer(c, seq, body) {\n  const line = c.lines.find((l) => l.seq === seq);\n  if (body.ignored) { if (line) line.pending = false; return render(); }\n  if (![\"SAFE\", \"UNSURE\", \"SCAM\"].includes(body.verdict)) return markError(c, seq, \"Server gave no verdict\");\n  const flags = SIGNALS.filter((s) => (body.scores?.[s] ?? 0) >= SIGNAL_ON);\n  c.points.push({ seq, t: (Date.now() - c.startedAt) / 1000, combined: body.combined_score,\n    urgency: body.scores?.urgency, money: body.scores?.money, impersonation: body.scores?.impersonation });\n  if (line) { line.pending = false; line.flags = flags; }\n  if (seq >= c.lastOutcomeSeq) {           // answers can arrive out of order; newest wins\n    c.lastOutcomeSeq = seq;\n    c.verdict = body.verdict;\n    c.combinedScore = body.combined_score ?? c.combinedScore;\n    c.callScores = body.recent_scores ?? body.call_scores ?? c.callScores;\n    c.error = null;\n  }\n  if (c.verdict === \"SCAM\" && !c.scamAlert) {\n    c.scamAlert = true;\n    try { navigator.vibrate?.(600); } catch { /* not supported */ }\n    showAlert(c);\n  }\n  render();\n}\n\nfunction markError(c, seq, msg) {\n  const line = c.lines.find((l) => l.seq === seq);\n  if (line) { line.pending = false; line.failed = true; }\n  if (seq >= c.lastOutcomeSeq) { c.lastOutcomeSeq = seq; c.error = msg; }\n  render();\n}\n\nfunction stopTimers() { if (call) { call.timers.forEach(clearTimeout); call.timers = []; } }\n\n/** Back during a call: the server is told (so it clears the call's memory); no summary, nothing saved. */\nfunction discard() {\n  if (call && screen === \"call\" && !call.ended) {\n    call.ended = true; stopTimers();\n    sendEnd(call, \"user_discarded\");\n  }\n  call = null; closeOverlay(); go(\"home\");\n}\n\nfunction sendEnd(c, endedBy) {\n  return api(\"v1/call/end\", {\n    call_id: c.id, ended_by: endedBy, last_seq: Math.max(0, ...c.lines.map((l) => l.seq)),\n    caller_lines: c.lines.filter((l) => l.isCaller && l.text.trim()).map((l) => ({ seq: l.seq, text: l.text })),\n    ...(c.script.lang ? { lang: c.script.lang } : {}), event: \"end\",\n  }, 5000).then((r) => (r.ok ? r.json : null)).catch(() => null);\n}\n\nasync function endCall(c, endedBy) {\n  if (c.ended || c !== call) return;\n  c.ended = true; stopTimers();\n  c.lines.forEach((l) => { if (l.pending) { l.pending = false; l.failed = true; } });\n  c.reviewing = true;\n  closeOverlay();\n  go(\"summary\");\n  const resp = await Promise.race([sendEnd(c, endedBy), sleep(FINAL_REVIEW_WAIT_MS).then(() => null)]);\n  const verdict = [\"SAFE\", \"UNSURE\", \"SCAM\"].includes(resp?.final_verdict) ? resp.final_verdict : null;\n  c.finalReview = resp\n    ? { finalVerdict: verdict, reason: resp.reason || \"\", reviewed: resp.review === \"bert\" && verdict !== null,\n        topWindowSeqs: resp.top_window_seqs || [], answered: true }\n    : { finalVerdict: null, reason: \"\", reviewed: false, topWindowSeqs: [], answered: false };\n  c.reviewing = false;\n  saveHistory(c);\n  if (c === call) render();\n}\n\n// ---------------------------------------------------------------- history (B.7, in this browser)\n\nconst history = () => store.get(\"calls\", []);\nconst historyVerdict = (lvl) => ({ RED: \"SCAM\", YELLOW: \"UNSURE\", GREEN: \"SAFE\" }[lvl] || \"NOT CHECKED\");\nfunction reasonCode(lvl, scores, serverReason) {\n  if (lvl === \"RED\" || lvl === \"YELLOW\") {\n    const fromServer = Object.entries(REASON_TEXT).find(([, t]) => t.toLowerCase() === (serverReason || \"\").trim().toLowerCase());\n    if (fromServer) return fromServer[0];\n    const lit = SIGNALS.filter((s) => (scores[s] ?? 0) >= SIGNAL_ON).sort((a, b) => scores[b] - scores[a]);\n    return lit[0] || \"several\";\n  }\n  return { GREEN: \"none\", ERROR: \"server_not_reached\" }[lvl] || \"no_lines\";\n}\nfunction saveHistory(c) {\n  if (c.script.kind === \"pasted\") return;\n  const lvl = summaryLevel(c);\n  const verdict = historyVerdict(lvl);\n  let sentence = null;\n  if (store.get(\"saveSentence\", false) && (verdict === \"SCAM\" || verdict === \"UNSURE\")) {\n    const best = c.points.map((p) => [p.seq, Math.max(p.urgency ?? 0, p.money ?? 0, p.impersonation ?? 0)])\n      .filter(([, s]) => s >= SIGNAL_ON).sort((a, b) => b[1] - a[1] || b[0] - a[0])[0];\n    if (best) sentence = c.lines.find((l) => l.seq === best[0])?.text ?? null;\n  }\n  const calls = history();\n  calls.unshift({\n    id: c.id, startedAt: c.startedAt, endedAt: Date.now(), finalVerdict: verdict, liveVerdict: historyVerdict(callLevel(c)),\n    reasonCode: reasonCode(lvl, c.callScores, c.finalReview?.reason), callScore: c.combinedScore,\n    review: c.finalReview?.reviewed ? \"bert\" : c.finalReview?.answered ? \"fallback\" : \"unavailable\",\n    title: c.script.title, riskiestSentence: sentence, points: c.points.map((p) => [p.t, p.combined]),\n  });\n  store.set(\"calls\", calls.slice(0, 200));\n}\n\n// ---------------------------------------------------------------- report (H.3)\n\nasync function sendReport(c, kind) {\n  const lines = reportPreview(c);\n  if (!lines.length) return \"Nothing to report: the caller said nothing.\";\n  const text = lines.map((l) => l.text).join(\" \");\n  const chinese = [...text].filter((ch) => ch >= \"一\" && ch <= \"鿿\").length;\n  const language = c.script.lang || (chinese * 10 > text.length * 3 ? \"zh\" : \"en\");\n  try {\n    const r = await api(\"v1/report\", { call_id: c.id, kind, app_verdict: c.verdict || \"\", language, consent: true, lines, consent_version: 2 });\n    if (r.ok) return `Thank you. Shared ${r.json?.lines_stored ?? lines.length} lines; lines not approved for training are deleted after 30 days.`;\n    if (r.status === 503) return \"Reporting is not set up on this server.\";\n    return `Could not send the report (server answered ${r.status}).`;\n  } catch (e) { return \"Could not send the report: \" + (e.name || \"error\"); }\n}\nconst reportPreview = (c) => c.lines.filter((l) => l.isCaller && l.text.trim()).map((l) => ({ seq: l.seq, text: Mask(l.text) }));\n\n// ---------------------------------------------------------------- rendering helpers\n\nconst $ = (sel) => document.querySelector(sel);\nconst sleep = (ms) => new Promise((r) => setTimeout(r, ms));\nconst esc = (s) => String(s ?? \"\").replace(/[&<>\"']/g, (ch) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[ch]));\nconst fmtDate = (ms) => new Date(ms).toLocaleString(undefined, { day: \"numeric\", month: \"short\", year: \"numeric\", hour: \"2-digit\", minute: \"2-digit\" });\nconst banner = (text, color) => `<div class=\"banner\" style=\"border-color:${color};background:color-mix(in srgb, ${color} 15%, transparent)\">${esc(text)}</div>`;\nconst back = (to, label = \"‹ Back\") => `<button class=\"link\" data-go=\"${to}\">${label}</button>`;\n\nfunction bubble(l, risky = false) {\n  const state = l.pending ? `<div class=\"state\">checking…</div>` : l.failed ? `<div class=\"state\">could not check</div>` : \"\";\n  const flags = l.flags?.length ? `<div class=\"flags\">⚑ ${l.flags.map(chipLabel).join(\", \")}</div>` : \"\";\n  return `<div class=\"bubble ${l.isCaller ? \"\" : \"me\"} ${l.flags?.length ? \"flagged\" : \"\"} ${risky ? \"risky\" : \"\"}\">\n    <div class=\"who\">${l.isCaller ? \"Caller\" : \"You\"}${risky ? \" · where it turned risky\" : \"\"}</div>${esc(l.text)}${flags}${state}</div>`;\n}\n\nfunction go(to) { screen = to; render(); if (to === \"call\" || to === \"home\") $(\"#screen\").scrollTop = 0; }\n\n// ---------------------------------------------------------------- screens\n\nconst SCREENS = {\n  home: () => `\n    <h1>ScamGuard</h1>\n    <p class=\"muted\">Simulate a call and watch the scam check work live.</p>\n    <button class=\"btn fill wide\" data-act=\"scam\">Simulate scam call</button>\n    <button class=\"btn fill wide\" data-act=\"normal\">Simulate normal call</button>\n    <button class=\"btn wide\" data-go=\"pick\">Choose a call script…</button>\n    <button class=\"btn wide\" data-go=\"paste\">Paste text</button>\n    ${scripts.length ? \"\" : `<div class=\"note\">No call scripts found at <code>scripts/</code>. Paste text still works.</div>`}\n    <div class=\"note small\">Web version of the ScamGuard Android app. It checks calls with the ScamGuard server\n      (privacy level 1, Cloud). The on-device privacy levels need the Android app.</div>`,\n\n  pick: () => {\n    const shown = scripts.filter((s) => (!pickFilter.kind || s.kind === pickFilter.kind) && (!pickFilter.lang || s.lang === pickFilter.lang));\n    const chip = (key, val, label) => `<button class=\"chip ${pickFilter[key] === val ? \"sel\" : \"\"}\" data-filter=\"${key}:${val ?? \"\"}\">${label}</button>`;\n    return `${back(\"home\")}<h1>Call scripts</h1>\n      <div class=\"chips\">${chip(\"kind\", null, \"All\")}${chip(\"kind\", \"scam\", \"Scam\")}${chip(\"kind\", \"normal\", \"Normal\")}\n        ${chip(\"lang\", null, \"Any language\")}${chip(\"lang\", \"en\", \"English\")}${chip(\"lang\", \"zh\", \"中文\")}</div>\n      ${shown.map((s) => `<div class=\"card click row\" data-script=\"${esc(s.file)}\">\n        <div class=\"grow\"><div style=\"font-weight:600\">${esc(s.title)}</div>\n          <div class=\"small muted\">${s.lines.length} lines · ${s.lang === \"zh\" ? \"Mandarin\" : s.lang === \"en\" ? \"English\" : \"auto\"}</div></div>\n        <span class=\"tag\" style=\"background:${s.kind === \"scam\" ? \"var(--scam)\" : \"var(--safe)\"}\">${s.kind === \"scam\" ? \"Scam\" : \"Normal\"}</span>\n      </div>`).join(\"\") || `<p class=\"muted\">No scripts match.</p>`}`;\n  },\n\n  paste: () => `${back(\"home\")}<h1>Paste text</h1>\n    <p class=\"muted small\">Paste what a caller said (a message, a transcript). It is checked as one caller line.</p>\n    <textarea id=\"pasted\" placeholder=\"e.g. This is the police. Transfer the money to the safe account now.\"></textarea>\n    <button class=\"btn fill wide\" data-act=\"check-pasted\">Check</button>`,\n\n  ringing: () => `<div class=\"ringing\">\n      <div><p class=\"muted\">Incoming call</p><div class=\"avatar\">👤</div>\n        <h1>Unknown caller</h1><p class=\"muted\">Private number</p>\n        <p class=\"small muted\" style=\"margin-top:8px\">Script: ${esc(call.script.title)}</p></div>\n      <div class=\"answer-row\">\n        <div><button class=\"round\" style=\"background:var(--scam)\" data-act=\"decline\" aria-label=\"Decline\">✕</button><span class=\"small\">Decline</span></div>\n        <div><button class=\"round\" style=\"background:var(--safe)\" data-act=\"answer\" aria-label=\"Answer\">✆</button><span class=\"small\">Answer</span></div>\n      </div></div>`,\n\n  call: () => {\n    const c = call, lvl = callLevel(c), lit = litSignals(c.callScores), color = COLORS[lvl];\n    const has = [\"SAFE\", \"UNSURE\", \"SCAM\"].includes(c.verdict);\n    const progress = lvl === \"LISTENING\" ? 0 : lvl === \"ERROR\" ? 1 : Math.max(0.04, Math.min(1, c.combinedScore ?? 0));\n    const b = bannerFor(lvl, lit, flaggedTexts(c));\n    return `<div class=\"row\"><div class=\"grow\"><div style=\"font-weight:600\">Unknown caller</div>\n        <div class=\"small muted\">${esc(c.script.title)} · Cloud</div></div></div>\n      <div class=\"riskbar\">\n        <div class=\"row\"><span class=\"grow\" style=\"font-weight:600;color:${color}\">${LABELS[lvl]}</span>\n          ${has && c.combinedScore != null ? `<span class=\"small\">risk ${c.combinedScore.toFixed(2)}</span>` : \"\"}</div>\n        <div class=\"track\"><div class=\"bar\" style=\"width:${progress * 100}%;background:${color}\"></div></div>\n      </div>\n      <div class=\"chips\">${SIGNALS.map((s) => `<span class=\"chip ${lit.includes(s) ? \"on\" : \"\"}\">${chipLabel(s)}</span>`).join(\"\")}</div>\n      ${b ? banner(b, color) : \"\"}\n      <div class=\"chat\">${c.lines.map((l) => bubble(l)).join(\"\")}</div>\n      <div class=\"sticky-bottom\"><button class=\"btn red wide\" data-act=\"hangup\">Hang up</button></div>`;\n  },\n\n  summary: () => {\n    const c = call;\n    if (c.reviewing) return `<h1>Call summary</h1><h2>Final review…</h2><p class=\"small muted\">Checking the whole call once more.</p>`;\n    const lvl = summaryLevel(c), fr = c.finalReview, risky = new Set(fr?.topWindowSeqs || []), lit = litSignals(c.callScores);\n    const reason = fr?.reason && (lvl === \"RED\" || lvl === \"YELLOW\") ? fr.reason : null;\n    const b = reason ? `${reason}. ${actionFor(lit)}` : bannerFor(lvl, lit, flaggedTexts(c));\n    const shown = c.lines.filter((l) => l.isCaller && (l.flags.length || risky.has(l.seq)));\n    const sent = (c.reportResult || \"\").startsWith(\"Thank you\");\n    return `<h1>Call summary</h1>\n      <h2 style=\"font-size:24px;color:${COLORS[lvl]}\">${LABELS[lvl].toUpperCase()}</h2>\n      <p class=\"small muted\">During the call: ${LABELS[callLevel(c)]}${fr?.reviewed ? \"\" : \" · Final review unavailable\"}</p>\n      ${b ? banner(b, COLORS[lvl]) : \"\"}\n      <h2>What triggered it</h2>\n      ${shown.length ? `<div class=\"chat\">${shown.map((l) => bubble(l, risky.has(l.seq))).join(\"\")}</div>` : `<p>No caller lines were flagged.</p>`}\n      <a class=\"btn red wide\" href=\"${SCAMSHIELD_URL}\" target=\"_blank\" rel=\"noopener\">Report to ScamShield</a>\n      <div class=\"row\">\n        <button class=\"btn grow\" data-act=\"report-scam\" ${sent || c.sending ? \"disabled\" : \"\"}>This was a scam</button>\n        <button class=\"btn grow\" data-act=\"report-fine\" ${sent || c.sending ? \"disabled\" : \"\"}>This was fine</button>\n      </div>\n      ${c.sending ? `<p class=\"small\">Sending…</p>` : \"\"}\n      ${c.reportResult ? `<p class=\"small\">${esc(c.reportResult)}</p>` : \"\"}\n      <button class=\"btn wide\" data-act=\"done\">Done</button>`;\n  },\n\n  dashboard: () => {\n    const calls = history();\n    const counts = {};\n    calls.filter((c) => c.finalVerdict === \"SCAM\" || c.finalVerdict === \"UNSURE\")\n      .forEach((c) => { const t = REASON_TEXT[c.reasonCode] || c.reasonCode; counts[t] = (counts[t] || 0) + 1; });\n    const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 3);\n    const save = store.get(\"saveSentence\", false);\n    return `<h1>Dashboard</h1>\n      <div class=\"card\"><div style=\"font-weight:600\">Most common warning reasons</div>\n        ${top.length ? top.map(([r, n]) => `<div class=\"row\"><span class=\"grow\">${esc(r)}</span><b>${n}×</b></div>`).join(\"\") : `<p class=\"small\">No warnings yet.</p>`}</div>\n      <h2>Past calls (${calls.length})</h2>\n      ${calls.length ? calls.map((c) => `<div class=\"card click row\" data-open=\"${esc(c.id)}\">\n          <span class=\"dot\" style=\"background:${COLORS[level(c.finalVerdict === \"NOT CHECKED\" ? null : c.finalVerdict, c.finalVerdict === \"NOT CHECKED\")]}\"></span>\n          <div class=\"grow\"><div class=\"row\"><b class=\"grow\" style=\"color:${COLORS[level(c.finalVerdict === \"NOT CHECKED\" ? null : c.finalVerdict, c.finalVerdict === \"NOT CHECKED\")]}\">${esc(c.finalVerdict)}</b>\n            <span class=\"tiny muted\">${fmtDate(c.endedAt)}</span></div>\n            <div class=\"row\"><span class=\"grow small\">${esc(REASON_TEXT[c.reasonCode] || c.reasonCode)}</span><span class=\"tiny muted\">Cloud · Web</span></div></div>\n        </div>`).join(\"\") : `<p>No calls yet.</p>`}\n      <hr><h2>Privacy</h2>\n      <label class=\"switch\"><span class=\"grow\"><span>Save the riskiest sentence</span><br>\n        <span class=\"small muted\">Keeps the one caller line that scored highest in calls that ended with a warning. Off: no words from your calls are kept, only verdicts and scores.</span></span>\n        <input type=\"checkbox\" id=\"save-sentence\" ${save ? \"checked\" : \"\"}></label>\n      <p class=\"small muted\">Your history stays in this browser. Nothing on this screen is uploaded.</p>\n      <button class=\"btn wide\" data-act=\"delete-history\" ${calls.length ? \"\" : \"disabled\"}>Delete my history</button>`;\n  },\n\n  detail: () => {\n    const c = history().find((x) => x.id === openCallId);\n    if (!c) return `${back(\"dashboard\")}<p>Call not found.</p>`;\n    const color = COLORS[level(c.finalVerdict === \"NOT CHECKED\" ? null : c.finalVerdict, c.finalVerdict === \"NOT CHECKED\")];\n    return `${back(\"dashboard\")}<h1>Call details</h1>\n      <h2 style=\"font-size:22px;color:${color}\">${esc(c.finalVerdict)}</h2>\n      <p class=\"small muted\">${fmtDate(c.startedAt)} · ${esc(c.title || \"\")} · during the call: ${esc(c.liveVerdict)} · review: ${esc(c.review)}</p>\n      <div class=\"card\"><b>Reason</b><p>${esc(REASON_TEXT[c.reasonCode] || c.reasonCode)}</p></div>\n      <h2>Risk during the call</h2>${chart(c.points || [])}\n      <p class=\"tiny muted\">Dashed lines: UNSURE (${UNSURE_LINE}) and SCAM (${SCAM_LINE}) thresholds.</p>\n      ${c.riskiestSentence ? `<div class=\"card\"><b>Riskiest sentence</b><p>“${esc(c.riskiestSentence)}”</p></div>` : \"\"}`;\n  },\n\n  settings: () => {\n    const url = gatewayUrl();\n    const encrypted = /^https:\\/\\//i.test(url) || (!/^http:\\/\\//i.test(url) && location.protocol === \"https:\");\n    return `<h1>Settings</h1>\n      <label class=\"field\">Gateway URL<input type=\"text\" id=\"url\" value=\"${esc(url)}\" spellcheck=\"false\"></label>\n      <p class=\"small\" style=\"color:${encrypted ? \"var(--primary)\" : \"var(--scam)\"}\">${encrypted ? \"Encrypted (HTTPS)\" : \"Not encrypted: transcripts are sent as plain text\"}</p>\n      <p class=\"small muted\"><b>api/</b> (the default) means the server this page came from: the docker compose edge\n        (http://127.0.0.1:8088/) or the Kubernetes Ingress (https://&lt;laptop IP&gt;:8443/). Another server must allow\n        this page's address (CORS).</p>\n      <div class=\"row\"><button class=\"btn fill\" data-act=\"save-url\">Save</button><button class=\"btn\" data-act=\"test-url\">Test connection</button></div>\n      <p id=\"url-result\" class=\"small\"></p>\n      <hr><h2>Privacy level</h2>\n      <div class=\"radio\"><input type=\"radio\" checked><div><div>1. Cloud (default)</div>\n        <div class=\"small muted\">Every caller sentence is checked by the ScamGuard server. Nothing is stored there.</div></div></div>\n      <div class=\"radio off\"><input type=\"radio\" disabled><div><div>2. Hybrid</div>\n        <div class=\"small muted\">Android app only: checked on the phone, only unsure moments go to the server.</div></div></div>\n      <div class=\"radio off\"><input type=\"radio\" disabled><div><div>3. On-device</div>\n        <div class=\"small muted\">Android app only: everything is checked on the phone, even in airplane mode.</div></div></div>\n      <p class=\"small muted\">On-device models, federated learning on the phone and levels 2 and 3 need the Android app\n        (android-app/ in Android Studio).</p>`;\n  },\n};\n\nfunction chart(points) {\n  const pts = points.filter(([, v]) => v != null).sort((a, b) => a[0] - b[0]);\n  const w = 400, h = 180, pad = 18;\n  const maxT = Math.max(1, ...pts.map(([t]) => t));\n  const x = (t) => pad + (t / maxT) * (w - 2 * pad), y = (v) => h - pad - Math.min(1, Math.max(0, v)) * (h - 2 * pad);\n  const line = (v, col) => `<line x1=\"${pad}\" x2=\"${w - pad}\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"${col}\" stroke-dasharray=\"4 4\"/>`;\n  const path = pts.map(([t, v], i) => `${i ? \"L\" : \"M\"}${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(\" \");\n  return `<svg class=\"chart\" viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Risk score over the call\">\n    ${line(UNSURE_LINE, \"var(--warn)\")}${line(SCAM_LINE, \"var(--scam)\")}\n    ${pts.length ? `<path d=\"${path}\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"2.5\"/>` +\n      pts.map(([t, v]) => `<circle cx=\"${x(t)}\" cy=\"${y(v)}\" r=\"3\" fill=\"var(--primary)\"/>`).join(\"\") :\n      `<text x=\"${w / 2}\" y=\"${h / 2}\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"13\">No scores</text>`}</svg>`;\n}\n\n// ---------------------------------------------------------------- overlays\n\nfunction closeOverlay() { const o = $(\"#overlay\"); o.hidden = true; o.innerHTML = \"\"; }\nfunction showAlert(c) {\n  if (c.alertShown) return;\n  c.alertShown = true;\n  const lit = litSignals(c.callScores);\n  const o = $(\"#overlay\");\n  o.innerHTML = `<div class=\"alert\" role=\"alertdialog\" aria-label=\"Scam warning\">\n    <div style=\"font-size:22px;font-weight:700\">⚠ WARNING</div>\n    <div>This call looks like a scam: ${esc(reasonFor(lit, flaggedTexts(c)))}.</div><div>${esc(actionFor(lit))}</div>\n    <div class=\"row\"><button class=\"btn white grow\" data-act=\"hangup\">Hang up now</button><button class=\"btn\" data-act=\"dismiss\">Dismiss</button></div></div>`;\n  o.hidden = false;\n}\nfunction showConsent(c, kind) {\n  const lines = reportPreview(c);\n  const o = $(\"#overlay\");\n  o.innerHTML = `<div class=\"dialog\" role=\"dialog\" aria-label=\"Share this call\">\n    <h2 style=\"font-size:20px\">${kind === \"scam\" ? \"Share this scam call?\" : \"Share this call as a false alarm?\"}</h2>\n    <p>Helps ScamGuard learn new scams. A team member reads it, labels it, and it may be used to retrain the detectors.</p>\n    <p class=\"small\">Sent: the caller's ${lines.length} lines below. We try to remove numbers, amounts, links and names,\n      but some can slip through, such as a name said in passing or digits read out as words. Check the text; if you see\n      anything private, choose Don't share.</p>\n    <p class=\"small\">Not sent: your phone number, the caller's number, anything you said.</p>\n    <p class=\"small\">Kept: deleted after 30 days, except lines a reviewer approves as training examples. Those stay\n      encrypted with no link to you, so they can't be withdrawn later.</p><hr>\n    <div>${lines.map((l) => `<div class=\"quote\">“${esc(l.text)}”</div>`).join(\"\")}</div>\n    <div class=\"actions\"><button class=\"btn\" data-act=\"consent-no\">Don't share</button>\n      <button class=\"btn fill\" data-act=\"consent-yes\" data-kind=\"${kind}\" ${lines.length ? \"\" : \"disabled\"}>Share</button></div></div>`;\n  o.hidden = false;\n}\n\n// ---------------------------------------------------------------- render + events\n\nconst TAB_OF = { home: \"home\", dashboard: \"dashboard\", detail: \"dashboard\", settings: \"settings\" };\nfunction render() {\n  const keepScroll = screen === \"call\" ? null : $(\"#screen\").scrollTop;\n  $(\"#screen\").innerHTML = SCREENS[screen]();\n  const tab = TAB_OF[screen];\n  $(\"#tabs\").hidden = !tab || screen === \"detail\";\n  document.querySelectorAll(\"#tabs button\").forEach((b) => b.classList.toggle(\"on\", b.dataset.tab === tab));\n  if (screen === \"call\") { const s = $(\"#screen\"); s.scrollTop = s.scrollHeight; }\n  else if (keepScroll != null) $(\"#screen\").scrollTop = keepScroll;\n}\n\ndocument.addEventListener(\"click\", async (e) => {\n  const el = e.target.closest(\"[data-go],[data-act],[data-tab],[data-script],[data-open],[data-filter]\");\n  if (!el) return;\n  if (el.dataset.tab) return go(el.dataset.tab);\n  if (el.dataset.go) return go(el.dataset.go);\n  if (el.dataset.script) return ring(scripts.find((s) => s.file === el.dataset.script));\n  if (el.dataset.open) { openCallId = el.dataset.open; return go(\"detail\"); }\n  if (el.dataset.filter) { const [k, v] = el.dataset.filter.split(\":\"); pickFilter[k] = v || null; return render(); }\n  const c = call;\n  switch (el.dataset.act) {\n    case \"scam\": case \"normal\": { const s = randomScript(el.dataset.act); if (s) ring(s); else alertNoScripts(); break; }\n    case \"check-pasted\": {\n      const text = $(\"#pasted\").value.trim();\n      if (!text) return;\n      call = newCall({ file: \"pasted\", kind: \"pasted\", lang: null, title: \"Pasted text\", lines: [{ speaker: \"caller\", text, delay_ms: 0 }] });\n      answer(); break;\n    }\n    case \"answer\": answer(); break;\n    case \"decline\": stopTimers(); call = null; go(\"home\"); break;\n    case \"hangup\": if (c) endCall(c, \"user_hung_up\"); break;\n    case \"dismiss\": closeOverlay(); break;\n    case \"done\": call = null; go(\"home\"); break;\n    case \"report-scam\": case \"report-fine\": showConsent(c, el.dataset.act === \"report-scam\" ? \"scam\" : \"fine\"); break;\n    case \"consent-no\": closeOverlay(); c.reportResult = \"Nothing was shared.\"; render(); break;\n    case \"consent-yes\":\n      closeOverlay(); c.sending = true; render();\n      c.reportResult = await sendReport(c, el.dataset.kind); c.sending = false; render(); break;\n    case \"delete-history\":\n      if (confirm(\"Delete my history?\\n\\nDeletes every saved call in this browser: verdicts, charts and saved sentences. This can't be undone.\")) {\n        store.set(\"calls\", []); render();\n      }\n      break;\n    case \"save-url\": store.set(\"gatewayUrl\", $(\"#url\").value.trim() || \"api/\"); $(\"#url-result\").textContent = \"Saved\"; break;\n    case \"test-url\": {\n      const out = $(\"#url-result\");\n      out.textContent = \"Testing…\";\n      try {\n        const r = await api(\"healthz\", undefined, 4000, $(\"#url\").value);\n        out.textContent = !r.ok ? `Server answered ${r.status}${r.status === 404 ? \": check the address (it should end in /api/)\" : \"\"}`\n          : r.json?.status === \"ok\" ? \"Connected: ok\" : \"Something answered, but not the ScamGuard gateway: check the address\";\n      } catch { out.textContent = \"Could not connect (server down, wrong address, or the server doesn't allow this page: CORS)\"; }\n      break;\n    }\n  }\n});\ndocument.addEventListener(\"change\", (e) => {\n  if (e.target.id === \"save-sentence\") {\n    store.set(\"saveSentence\", e.target.checked);\n    if (!e.target.checked) store.set(\"calls\", history().map((c) => ({ ...c, riskiestSentence: null })));\n  }\n});\ndocument.addEventListener(\"keydown\", (e) => {\n  if (e.key !== \"Escape\") return;\n  if (!$(\"#overlay\").hidden && screen !== \"call\") return closeOverlay();\n  if (screen === \"call\") return discard();\n  if ([\"pick\", \"paste\", \"ringing\"].includes(screen)) { stopTimers(); call = null; go(\"home\"); }\n  else if (screen === \"detail\") go(\"dashboard\");\n});\nfunction alertNoScripts() { $(\"#screen\").insertAdjacentHTML(\"beforeend\", `<div class=\"note\">No call scripts could be loaded.</div>`); }\n\nrender();\nloadScripts().then(render);\n"
  index.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#6650a4\">\n  <title>ScamGuard</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <!-- ScamGuard web app: the Android app's cloud mode (privacy level 1) in a browser, so the system can be tried\n       without Android Studio. Served by the compose \"edge\" (http://127.0.0.1:8088/) and by the Kubernetes Ingress\n       (https://<laptop IP>:8443/). It calls the same gateway as the phone, at api/ on the same address. -->\n  <div id=\"phone\">\n    <main id=\"screen\" aria-live=\"polite\"></main>\n    <nav id=\"tabs\" aria-label=\"Main\">\n      <button data-tab=\"home\"><span class=\"ico\">⌂</span>Home</button>\n      <button data-tab=\"dashboard\"><span class=\"ico\">☰</span>Dashboard</button>\n      <button data-tab=\"settings\"><span class=\"ico\">⚙</span>Settings</button>\n    </nav>\n  </div>\n  <div id=\"overlay\" hidden></div>\n  <script src=\"app.js\"></script>\n</body>\n</html>\n"
  style.css: ":root {\n  --bg: #fffbfe; --surface: #f4eff4; --card: #ffffff; --text: #1c1b1f; --muted: #605d66; --outline: #cac4d0;\n  --primary: #6650a4; --on-primary: #ffffff;\n  --safe: #2e7d32; --warn: #f9a825; --scam: #c62828; --grey: #9e9e9e;\n  --bubble-caller: #ece6f0; --bubble-me: #e8def8;\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #1c1b1f; --surface: #2b2930; --card: #25232a; --text: #e6e1e5; --muted: #cac4d0; --outline: #49454f;\n    --primary: #d0bcff; --on-primary: #381e72; --bubble-caller: #36343b; --bubble-me: #4a4458;\n  }\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody {\n  background: var(--surface); color: var(--text);\n  font: 16px/1.45 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  display: flex; justify-content: center;\n}\n#phone {\n  width: 100%; max-width: 480px; height: 100dvh; background: var(--bg);\n  display: flex; flex-direction: column; box-shadow: 0 0 24px rgba(0,0,0,.12);\n}\n#screen { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }\n#tabs { display: flex; border-top: 1px solid var(--outline); background: var(--surface); }\n#tabs[hidden] { display: none; }\n#tabs button {\n  flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 0 10px; font: inherit; font-size: 13px;\n  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;\n}\n#tabs button .ico { font-size: 20px; line-height: 28px; width: 56px; border-radius: 14px; }\n#tabs button.on { color: var(--text); font-weight: 600; }\n#tabs button.on .ico { background: var(--bubble-me); }\n\nh1 { font-size: 28px; font-weight: 600; margin: 4px 0 0; }\nh2 { font-size: 17px; font-weight: 600; margin: 8px 0 0; }\np { margin: 0; }\n.muted { color: var(--muted); }\n.small { font-size: 13px; }\n.tiny { font-size: 12px; }\nhr { border: 0; border-top: 1px solid var(--outline); margin: 4px 0; width: 100%; }\na { color: var(--primary); }\n\nbutton.btn, a.btn {\n  font: inherit; font-weight: 500; min-height: 48px; padding: 0 20px; border-radius: 24px; cursor: pointer;\n  border: 1px solid var(--outline); background: none; color: var(--primary);\n  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;\n}\nbutton.btn.fill { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }\nbutton.btn.red, a.btn.red { background: var(--scam); color: #fff; border-color: var(--scam); }\nbutton.btn.green { background: var(--safe); color: #fff; border-color: var(--safe); }\nbutton.btn.wide, a.btn.wide { width: 100%; min-height: 52px; }\nbutton.btn:disabled { opacity: .45; cursor: default; }\nbutton.link { border: 0; background: none; color: var(--primary); font: inherit; padding: 6px 0; cursor: pointer; align-self: flex-start; }\n.row { display: flex; gap: 8px; align-items: center; }\n.row > .grow { flex: 1; min-width: 0; }\n.card { background: var(--card); border: 1px solid var(--outline); border-radius: 12px; padding: 12px; }\n.card.click { cursor: pointer; }\n.card.click:hover { border-color: var(--primary); }\n.note { border-radius: 12px; padding: 10px 12px; border: 1px solid var(--outline); background: var(--surface); font-size: 14px; }\n.banner { border-radius: 12px; padding: 12px; border: 1px solid; }\n.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }\n.chips { display: flex; flex-wrap: wrap; gap: 8px; }\n.chip { border: 1px solid var(--outline); border-radius: 8px; padding: 4px 10px; font-size: 14px; color: var(--muted); background: none; font: inherit; font-size: 14px; }\nbutton.chip { cursor: pointer; }\n.chip.on { border-color: var(--scam); color: var(--scam); background: color-mix(in srgb, var(--scam) 14%, transparent); font-weight: 600; }\nbutton.chip.sel { border-color: var(--primary); color: var(--text); background: var(--bubble-me); }\n.tag { font-size: 12px; border-radius: 6px; padding: 1px 6px; color: #fff; }\n\n/* incoming call */\n.ringing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 48px 0 32px; text-align: center; }\n.avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--bubble-me); display: grid; place-items: center; font-size: 44px; margin: 24px auto 12px; animation: pulse 1.4s infinite; }\n@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent); } 50% { box-shadow: 0 0 0 18px transparent; } }\n.round { width: 72px; height: 72px; border-radius: 50%; border: 0; color: #fff; font-size: 28px; cursor: pointer; }\n.answer-row { display: flex; gap: 72px; justify-content: center; }\n.answer-row div { display: flex; flex-direction: column; align-items: center; gap: 6px; }\n\n/* in call */\n.riskbar { display: flex; flex-direction: column; gap: 6px; }\n.track { height: 14px; border-radius: 7px; background: var(--surface); overflow: hidden; }\n.bar { height: 100%; transition: width .4s, background-color .4s; }\n.chat { display: flex; flex-direction: column; gap: 8px; }\n.bubble { max-width: 85%; padding: 8px 12px; border-radius: 16px; background: var(--bubble-caller); border: 2px solid transparent; }\n.bubble.me { align-self: flex-end; background: var(--bubble-me); }\n.bubble.flagged { border-color: var(--scam); }\n.bubble.risky { border-color: var(--warn); }\n.bubble .who { font-size: 12px; color: var(--muted); }\n.bubble .state { font-size: 12px; color: var(--grey); }\n.bubble .flags { font-size: 12px; color: var(--scam); font-weight: 600; }\n.sticky-bottom { position: sticky; bottom: 0; background: var(--bg); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }\n\n/* overlays */\n#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }\n#overlay[hidden] { display: none; }\n.dialog { background: var(--bg); border-radius: 24px; padding: 20px; max-width: 440px; width: 100%; max-height: 90dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }\n.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }\n.alert { background: var(--scam); color: #fff; border-radius: 20px; padding: 20px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }\n.alert .btn { border-color: #fff; color: #fff; }\n.alert .btn.white { background: #fff; color: var(--scam); }\n.quote { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--outline); }\n\n/* settings */\nlabel.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }\ninput[type=text], textarea {\n  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--outline); border-radius: 8px; padding: 12px;\n}\ntextarea { min-height: 160px; resize: vertical; }\n.radio { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }\n.radio.off { opacity: .5; }\n.switch { display: flex; gap: 12px; align-items: center; }\n.switch input { width: 44px; height: 24px; flex: none; accent-color: var(--primary); }\nsvg.chart { width: 100%; height: 180px; background: var(--card); border: 1px solid var(--outline); border-radius: 12px; }\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-scripts
  namespace: scamguard
data:
  normal_en_10_bank_reminder.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good morning, this is a reminder call from your bank's card services.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, hello. Is something wrong?\",\n    \"delay_ms\": 4650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Not at all. Your credit card payment of two hundred and forty dollars is due on the twenty-fifth.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Right, I forgot about that. Thanks for reminding me.\",\n    \"delay_ms\": 6650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You can pay through the mobile app, internet banking, or GIRO if you have set it up.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I'll just use the app.\",\n    \"delay_ms\": 6300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Sure. And please remember, the bank will never ask you for your OTP or password over the phone.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Yes, I know. Thanks for the reminder.\",\n    \"delay_ms\": 6650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"No problem. If you have any questions, call the number printed on the back of your card.\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, will do.\",\n    \"delay_ms\": 6300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Thank you, have a good day.\",\n    \"delay_ms\": 2100\n  }\n]"
  normal_en_11_clinic_appointment.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, this is the clinic calling to confirm your appointment tomorrow at ten thirty.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Yes, I'll be there.\",\n    \"delay_ms\": 5300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Great. Please bring your NRIC and any medication you are currently taking.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay. Should I fast beforehand?\",\n    \"delay_ms\": 4650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, no food for eight hours before the blood test, but you can drink plain water.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Alright. How long will it take?\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"About thirty minutes. Please arrive ten minutes early to register at the counter.\",\n    \"delay_ms\": 3100\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Noted. Is parking available?\",\n    \"delay_ms\": 5000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, there is a carpark behind the building. The consultation fee can be paid at the counter after your visit.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, thanks.\",\n    \"delay_ms\": 7300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"See you tomorrow. Take care.\",\n    \"delay_ms\": 1750\n  }\n]"
  normal_en_12_delivery_driver.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hi, I'm the delivery driver. I'm downstairs at your block now with your order.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, I'll come down. Which entrance are you at?\",\n    \"delay_ms\": 5300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I'm at the lobby near the letterboxes. Blue jacket.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, give me two minutes. I'm just putting on my shoes.\",\n    \"delay_ms\": 3650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"No problem. Can you confirm the unit number? The app shows number twelve.\",\n    \"delay_ms\": 4750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Yes, number twelve, thanks.\",\n    \"delay_ms\": 5000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"The total is twenty-three dollars fifty. It's cash on delivery, or you can PayNow me.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I'll pay cash. Do you have change for fifty?\",\n    \"delay_ms\": 5650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, no problem.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Great, coming down now.\",\n    \"delay_ms\": 1700\n  }\n]"
  normal_en_13_insurance_sales.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, good afternoon. My name is Amelia, I'm calling from a financial advisory firm. Do you have a minute?\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I'm a bit busy, but go ahead.\",\n    \"delay_ms\": 6950\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"We have a new hospitalisation plan for young working adults. I would like to explain the benefits briefly.\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I already have an insurance plan through my company.\",\n    \"delay_ms\": 6650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"That's great. Many people find employer coverage ends when they change jobs, so a personal plan can be a good backup.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"How much is the premium?\",\n    \"delay_ms\": 7650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"It starts from about thirty dollars a month, depending on your age and the ward type.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Hmm, I'd need to think about it.\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Of course. This promotion ends at the end of the month, but there's no obligation. May I send you the brochure by email?\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Sure, you can email it. Please don't call again.\",\n    \"delay_ms\": 8300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Understood, thank you for your time.\",\n    \"delay_ms\": 4050\n  }\n]"
  normal_en_14_family_call.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, it's Mum. Are you free this weekend?\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Hi Mum, I think so. What's happening?\",\n    \"delay_ms\": 3350\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Ah Ma's birthday is on Sunday. Your aunt booked the restaurant for twelve o'clock.\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Nice. Do you want me to bring anything?\",\n    \"delay_ms\": 5300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Can you pick up the cake on the way? I'll PayNow you back after dinner.\",\n    \"delay_ms\": 3750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Sure, no problem. Which bakery?\",\n    \"delay_ms\": 5650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"The one near your office. Please remember to ask them to write her name on it.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, will do. What time should I reach?\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Come by eleven thirty, so we can all walk in together.\",\n    \"delay_ms\": 3750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Got it. See you Sunday, Mum.\",\n    \"delay_ms\": 4350\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Bye bye. Take care and eat properly ah.\",\n    \"delay_ms\": 3100\n  }\n]"
  normal_en_20_ica_passport_collection.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, this is a reminder call from the Immigration and Checkpoints Authority about your passport renewal.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh yes, I applied last month.\",\n    \"delay_ms\": 5970\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Your new passport is ready for collection at the ICA Building.\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Great. When can I collect it?\",\n    \"delay_ms\": 3990\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Please book a collection appointment through the MyICA app or the ICA website.\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, I'll do that tonight.\",\n    \"delay_ms\": 4710\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Remember to bring your old passport and your NRIC when you come.\",\n    \"delay_ms\": 2415\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Do I need to pay anything now?\",\n    \"delay_ms\": 4080\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"No, the fee was already paid with your application. ICA will never ask you to transfer money over the phone.\",\n    \"delay_ms\": 2550\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Good to know, thank you.\",\n    \"delay_ms\": 6060\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You're welcome. Have a nice day.\",\n    \"delay_ms\": 2280\n  }\n]\n"
  normal_en_21_bank_fraud_check.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, this is the card security team from your bank. We want to check one transaction on your credit card.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Sure, what transaction?\",\n    \"delay_ms\": 6015\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"There was a purchase of one hundred and twenty dollars at an online electronics store this morning. Was that you?\",\n    \"delay_ms\": 2235\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"No, I didn't buy anything today.\",\n    \"delay_ms\": 6285\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Thank you. We have blocked the card to keep your account safe, and the charge will be reversed.\",\n    \"delay_ms\": 2640\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay. Do I need to do anything?\",\n    \"delay_ms\": 5475\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"A replacement card will be mailed to your registered address in five working days.\",\n    \"delay_ms\": 2595\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Alright.\",\n    \"delay_ms\": 4890\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"We will never ask for your PIN or a one-time password. If you're unsure, call us back on the number on the back of your card.\",\n    \"delay_ms\": 1560\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I will. Thanks for letting me know.\",\n    \"delay_ms\": 6825\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You're welcome. Goodbye.\",\n    \"delay_ms\": 2775\n  }\n]\n"
  normal_en_22_telco_contract_renewal.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hi, I'm calling from Singtel. Your mobile contract ends at the end of this month.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, I didn't realise it was ending.\",\n    \"delay_ms\": 4845\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"We have a renewal offer with more data for the same monthly price of thirty-five dollars.\",\n    \"delay_ms\": 2775\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"What about a new phone?\",\n    \"delay_ms\": 5205\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You can add a new phone with the plan, and the promotion is available until the end of the month.\",\n    \"delay_ms\": 2235\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Let me think about it.\",\n    \"delay_ms\": 5565\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"No problem. You can also renew any time in the My Singtel app or at any of our shops.\",\n    \"delay_ms\": 2190\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, I'll check the app.\",\n    \"delay_ms\": 5025\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"There's nothing to pay today. Your current plan continues until you decide.\",\n    \"delay_ms\": 2325\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Thanks, bye.\",\n    \"delay_ms\": 4575\n  }\n]\n"
  normal_zh_10_bank_reminder.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"早上好，这里是银行信用卡服务部的提醒电话。\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"哦，你好，有什么问题吗？\",\n    \"delay_ms\": 5050\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"没有问题。您的信用卡有两百四十元的款项，本月二十五号到期。\",\n    \"delay_ms\": 3150\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"对，我差点忘了，谢谢你提醒我。\",\n    \"delay_ms\": 6700\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您可以用手机银行、网上银行，或者GIRO自动扣款来缴付。\",\n    \"delay_ms\": 3850\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我用手机银行就好。\",\n    \"delay_ms\": 5550\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"好的。另外请记住，银行绝对不会通过电话向您索取验证码或密码。\",\n    \"delay_ms\": 2950\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我知道的，谢谢提醒。\",\n    \"delay_ms\": 6900\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"不客气。如果有疑问，请拨打您信用卡背面印着的号码。\",\n    \"delay_ms\": 2950\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"好的。\",\n    \"delay_ms\": 5750\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"谢谢您，祝您有愉快的一天。\",\n    \"delay_ms\": 1550\n  }\n]"
  normal_zh_14_family_call.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"喂，是妈妈。这个周末你有空吗？\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"妈，我应该有空。怎么了？\",\n    \"delay_ms\": 3450\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"星期天是阿嬷的生日，你阿姨订了中午十二点的餐厅。\",\n    \"delay_ms\": 3150\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"太好了。要我带点什么吗？\",\n    \"delay_ms\": 5750\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"你来的路上能不能顺便取一下蛋糕？吃完饭我再用PayNow把钱转给你。\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"没问题，哪一家面包店？\",\n    \"delay_ms\": 6700\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"就是你公司附近那一家。记得请他们在蛋糕上写阿嬷的名字。\",\n    \"delay_ms\": 3150\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"好的。我几点到比较好？\",\n    \"delay_ms\": 6450\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"十一点半到吧，我们一起进去。\",\n    \"delay_ms\": 3150\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"知道了，星期天见，妈。\",\n    \"delay_ms\": 3450\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"再见，路上小心，要好好吃饭哦。\",\n    \"delay_ms\": 2950\n  }\n]"
  scam_en_10_gov_official.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good afternoon, this is the fraud prevention unit calling about your bank account.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, hello? What is this about?\",\n    \"delay_ms\": 5000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"We detected a credit card opened under your NRIC that was used for money laundering.\",\n    \"delay_ms\": 3100\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"What? I never opened any card. Are you sure?\",\n    \"delay_ms\": 5650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I understand. Because this is a serious case, I will transfer you to the Singapore Police Force now.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Police? Okay, okay.\",\n    \"delay_ms\": 6650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I am Inspector Tan from the Singapore Police Force, badge number two zero four seven.\",\n    \"delay_ms\": 2100\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Your name is linked to a criminal case and you may be arrested today if you do not cooperate.\",\n    \"delay_ms\": 6050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I didn't do anything. What do I need to do?\",\n    \"delay_ms\": 6950\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You must not tell anyone, not your family and not your bank. This investigation is confidential.\",\n    \"delay_ms\": 4400\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"To prove your innocence, we need to check your funds. Transfer your savings into a safety account that we provide.\",\n    \"delay_ms\": 6400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Transfer my savings? Is that really okay?\",\n    \"delay_ms\": 7300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Do it right now, within the next thirty minutes, or a warrant will be issued.\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Open your banking app and send all the money to this account number. Read me the OTP when the bank sends it.\",\n    \"delay_ms\": 6050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I'm scared. Let me find my phone.\",\n    \"delay_ms\": 7950\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Stay on the line. Do not hang up until the transfer is done.\",\n    \"delay_ms\": 3400\n  }\n]"
  scam_en_11_bank_otp.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, this is the security department of your bank. Is this the account holder?\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Yes, speaking. What happened?\",\n    \"delay_ms\": 5300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"We noticed a suspicious payment of three thousand two hundred dollars from your account to an overseas merchant.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I didn't make any payment! Please stop it.\",\n    \"delay_ms\": 6650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Don't worry, I can cancel it, but I need to verify your identity quickly.\",\n    \"delay_ms\": 3750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, what do you need?\",\n    \"delay_ms\": 5300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"The transaction will go through in five minutes, so we must act immediately.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Please hurry, I don't want to lose my money.\",\n    \"delay_ms\": 5000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I am sending a six-digit code to your phone now. Please read it out to me.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"It just came. It says it's for adding a new payee, is that okay?\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, that is normal, it is part of the cancellation process. Just tell me the numbers.\",\n    \"delay_ms\": 5700\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, one moment.\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Also give me your card number and the three digits at the back so I can block it.\",\n    \"delay_ms\": 2100\n  }\n]"
  scam_en_12_parcel_customs.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, this is the courier service. We have a parcel under your name that is held at customs.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"A parcel? I'm not expecting anything.\",\n    \"delay_ms\": 6650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"It was sent from overseas and the declared contents do not match, so customs has flagged it.\",\n    \"delay_ms\": 3100\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh. So what happens now?\",\n    \"delay_ms\": 6300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I will connect you to the customs enforcement officer. Please hold.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good afternoon, I am Officer Lim from Singapore Customs. You are being investigated for importing prohibited items.\",\n    \"delay_ms\": 4750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Prohibited items? I never ordered anything like that.\",\n    \"delay_ms\": 6300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"If you do not resolve this today, we will refer your case to the police and the parcel will be destroyed.\",\n    \"delay_ms\": 3750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"How can I settle it?\",\n    \"delay_ms\": 7650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You need to pay a release fee of four hundred and eighty dollars through PayNow.\",\n    \"delay_ms\": 2750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"PayNow? To whom?\",\n    \"delay_ms\": 5650\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I will send you the number now. Pay within one hour, otherwise the fine will double.\",\n    \"delay_ms\": 2100\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"After you pay, take a screenshot of the receipt and send it to me on WhatsApp.\",\n    \"delay_ms\": 6400\n  }\n]"
  scam_en_13_tech_support.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good morning, I am calling from the technical support team of your internet provider.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, okay? Is there a problem with my line?\",\n    \"delay_ms\": 5300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, our system shows your router has been hacked and your computer is sending out viruses.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh no, my son uses that computer for school.\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"It is very serious. Hackers may already have access to your personal files.\",\n    \"delay_ms\": 4050\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"What should I do?\",\n    \"delay_ms\": 5000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Please turn on your computer and open the web browser. I will guide you to download a support app.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, I am downloading it. It asks for a code.\",\n    \"delay_ms\": 6950\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, give me the nine-digit code on the screen so I can connect and clean your computer.\",\n    \"delay_ms\": 4400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, here it is.\",\n    \"delay_ms\": 6300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Now I can see your screen. The virus has reached your banking. Please log in to your internet banking so I can check.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Is that really necessary?\",\n    \"delay_ms\": 8300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, we must move your money to a protected account before the hackers take it. Please do it right now.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"The cleaning service also costs two hundred dollars. Please pay with gift cards from any convenience store.\",\n    \"delay_ms\": 7700\n  }\n]"
  scam_en_14_friend_in_trouble.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello Auntie, it's me! Guess who this is?\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Eh, who is this? Is it Jason?\",\n    \"delay_ms\": 3350\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes yes, it's Jason! Sorry, I changed my number, my old phone fell into the water.\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Aiyo, why you call so late? Everything okay?\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Auntie, I'm in a bit of trouble. I was in a car accident and the police are holding me at the station.\",\n    \"delay_ms\": 3750\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Accident?! Are you hurt?\",\n    \"delay_ms\": 7950\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I'm fine, but I need to pay the other driver's repair cost and bail today or they will charge me.\",\n    \"delay_ms\": 2400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"How much?\",\n    \"delay_ms\": 7300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Five thousand five hundred dollars. Please don't tell Mum, she will be so worried.\",\n    \"delay_ms\": 1750\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Can you PayNow it now? I'll give you the number. It's really urgent, they are waiting.\",\n    \"delay_ms\": 5700\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay okay, let me open my app.\",\n    \"delay_ms\": 6000\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Thank you Auntie, I'll pay you back next week, I promise. Please hurry.\",\n    \"delay_ms\": 3400\n  }\n]"
  scam_en_20_ica_to_china_police.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good afternoon, this is Officer Lim from the Immigration and Checkpoints Authority.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, hello. What is this about?\",\n    \"delay_ms\": 4935\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Our records show your passport details were used to register a SIM card in Shanghai last month.\",\n    \"delay_ms\": 2550\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Shanghai? I have never been to Shanghai.\",\n    \"delay_ms\": 5475\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"That number was used in a money laundering case, so the Chinese authorities have issued a notice under your name.\",\n    \"delay_ms\": 3000\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"That can't be right. What should I do?\",\n    \"delay_ms\": 6285\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I will transfer you now to Inspector Zhang from the Shanghai Public Security Bureau. Please stay on the line.\",\n    \"delay_ms\": 2910\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, I'm waiting.\",\n    \"delay_ms\": 6105\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"This is Inspector Zhang. If you do not cooperate today, a warrant will be issued and you can be arrested at the airport.\",\n    \"delay_ms\": 2010\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Please, I didn't do anything wrong.\",\n    \"delay_ms\": 6600\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"To clear your name, you must move all your savings into a supervision account so we can check the money is clean.\",\n    \"delay_ms\": 2775\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"All of it? How do I do that?\",\n    \"delay_ms\": 6285\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Go to the bank now and transfer it. Do not tell the bank staff or your family, this is a confidential investigation.\",\n    \"delay_ms\": 2460\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I need to think about this first.\",\n    \"delay_ms\": 6420\n  }\n]\n"
  scam_en_21_telco_to_mas_officer.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hello, I'm calling from Singtel customer service about a second mobile line registered under your NRIC.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I only have one line. I didn't register another one.\",\n    \"delay_ms\": 5835\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"This second line has been sending phishing messages, and many people have complained to us.\",\n    \"delay_ms\": 3540\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"That's not me. Someone must have used my details.\",\n    \"delay_ms\": 5295\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"I understand. Because it involves fraud, I have to connect you to an officer from the Monetary Authority of Singapore.\",\n    \"delay_ms\": 3405\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"The Monetary Authority? Okay.\",\n    \"delay_ms\": 6510\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"This is Officer Tan from MAS. Your bank accounts are linked to the fraud and will be frozen within the hour.\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Frozen? I need that money for my bills.\",\n    \"delay_ms\": 6060\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"To protect it, transfer your balance to a MAS safety account now. You will get it back after the investigation.\",\n    \"delay_ms\": 2955\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Can I call the bank first?\",\n    \"delay_ms\": 6195\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"No, the bank staff may be involved. Stay on the line with me while you do the transfer.\",\n    \"delay_ms\": 2370\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Hmm, this doesn't sound right to me.\",\n    \"delay_ms\": 5115\n  }\n]\n"
  scam_en_22_apple_support_crypto.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hi, this is Apple Support. You received an alert about a sign-in to your Apple ID from a new device.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Yes, I just got that message. It wasn't me.\",\n    \"delay_ms\": 5700\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Someone is trying to log in right now and they can reach your crypto exchange app through your iCloud.\",\n    \"delay_ms\": 3135\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh no, I have some Bitcoin on that app.\",\n    \"delay_ms\": 5790\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Don't worry, I will help you secure it. Please open the exchange app while I stay on the line.\",\n    \"delay_ms\": 2955\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, it's open.\",\n    \"delay_ms\": 5430\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"We need to act fast before they get in, every minute counts.\",\n    \"delay_ms\": 1920\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"What do I need to do?\",\n    \"delay_ms\": 3900\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Transfer all your coins to the Apple secure wallet address I'm sending you, then read me the six-digit code you receive.\",\n    \"delay_ms\": 2145\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Why does Apple need my coins?\",\n    \"delay_ms\": 6600\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"It's only temporary. Once the hacker is blocked, we send everything back to you.\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I think I will check with Apple myself first.\",\n    \"delay_ms\": 4800\n  }\n]\n"
  scam_en_23_bank_card_handover.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good morning, this is the fraud department of DBS Bank. We detected unusual withdrawals on your debit card.\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Really? I haven't used my card today.\",\n    \"delay_ms\": 6015\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Your card has been compromised and we must replace it today before more money is taken.\",\n    \"delay_ms\": 2865\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, how do I get a new card?\",\n    \"delay_ms\": 5115\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"For your safety, please don't go to the branch, it is being monitored by the syndicate.\",\n    \"delay_ms\": 2550\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"That's scary. Then what should I do?\",\n    \"delay_ms\": 5115\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Our officer will come to your home within the hour to collect the old card.\",\n    \"delay_ms\": 2820\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Alright, I'll be at home.\",\n    \"delay_ms\": 4575\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Put the card in an envelope and write your PIN on a note inside, so we can cancel it properly.\",\n    \"delay_ms\": 2325\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"My PIN too? Is that normal?\",\n    \"delay_ms\": 5430\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Yes, it's the standard procedure. Also withdraw your cash at the ATM and hand it to the officer for safekeeping.\",\n    \"delay_ms\": 2415\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I'll call the bank hotline first, thank you.\",\n    \"delay_ms\": 6240\n  }\n]\n"
  scam_en_24_job_task_deposit.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Hi, I'm Rachel from an online marketing agency. You applied for our part-time job, right?\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Oh, maybe. What's the job about?\",\n    \"delay_ms\": 5205\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You just like and review products on shopping sites from home. You can earn eighty to two hundred dollars a day.\",\n    \"delay_ms\": 2640\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"That sounds easy. Is there a catch?\",\n    \"delay_ms\": 6240\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"No catch. I already added three tasks to your account, and your first commission is waiting.\",\n    \"delay_ms\": 2775\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Okay, I see the tasks.\",\n    \"delay_ms\": 5340\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"Good. To withdraw your commission, the system needs you to complete one merchant task first.\",\n    \"delay_ms\": 2190\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"What is a merchant task?\",\n    \"delay_ms\": 5340\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"You top up five hundred dollars to the merchant account, and you get it back with thirty percent commission.\",\n    \"delay_ms\": 2280\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"Why do I have to pay to work?\",\n    \"delay_ms\": 6060\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"The task expires in twenty minutes, so please transfer now or you will lose everything you earned today.\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"I don't think I want this job.\",\n    \"delay_ms\": 5880\n  }\n]\n"
  scam_en_90_new_scam_test_A_report_this.json: "[\n  {\"speaker\": \"caller\", \"text\": \"Good evening, our recruiter saw your profile and has a work from home role for you.\", \"delay_ms\": 1500},\n  {\"speaker\": \"receiver\", \"text\": \"Oh, what kind of work is it?\", \"delay_ms\": 4000},\n  {\"speaker\": \"caller\", \"text\": \"You just rate products on our platform and earn commission each day.\", \"delay_ms\": 2500},\n  {\"speaker\": \"caller\", \"text\": \"The first task needs a small top up in USDT which comes back with your commission.\", \"delay_ms\": 5000},\n  {\"speaker\": \"receiver\", \"text\": \"I see. How do I start?\", \"delay_ms\": 4000},\n  {\"speaker\": \"caller\", \"text\": \"I will add you to the Telegram group where the mentor shows you the steps.\", \"delay_ms\": 2500},\n  {\"speaker\": \"caller\", \"text\": \"Top up again today to unlock the next task or your commission stays frozen.\", \"delay_ms\": 5000},\n  {\"speaker\": \"caller\", \"text\": \"Slots fill up fast so please decide tonight.\", \"delay_ms\": 5000}\n]\n"
  scam_en_91_new_scam_test_B_same_scam_new_words.json: "[\n  {\"speaker\": \"caller\", \"text\": \"Hi, our hiring team found your resume and we have a part time online job for you.\", \"delay_ms\": 1500},\n  {\"speaker\": \"receiver\", \"text\": \"Really? What would I do?\", \"delay_ms\": 4000},\n  {\"speaker\": \"caller\", \"text\": \"All you do is rate products on the platform and your commission builds up.\", \"delay_ms\": 2500},\n  {\"speaker\": \"caller\", \"text\": \"Task one needs a small USDT top up, which is returned together with your commission.\", \"delay_ms\": 5000},\n  {\"speaker\": \"receiver\", \"text\": \"Okay, then what?\", \"delay_ms\": 4000},\n  {\"speaker\": \"caller\", \"text\": \"Our mentor in the Telegram group explains each step.\", \"delay_ms\": 2500},\n  {\"speaker\": \"caller\", \"text\": \"One more top up today unlocks the next task, if not your commission stays frozen.\", \"delay_ms\": 5000},\n  {\"speaker\": \"caller\", \"text\": \"Places are filling up fast, so decide tonight.\", \"delay_ms\": 5000}\n]\n"
  scam_zh_10_gov_official.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您好，这里是银行的反欺诈部门，想跟您确认一下您的银行账户情况。\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"哦，你好？请问有什么事吗？\",\n    \"delay_ms\": 7150\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我们发现有人用您的身份证号码开了一张信用卡，而且这张卡被用于洗钱。\",\n    \"delay_ms\": 3400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"什么？我从来没有开过什么卡，你们搞错了吧？\",\n    \"delay_ms\": 7850\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我理解。因为案情严重，我现在把电话转接给新加坡警察部队的警官。\",\n    \"delay_ms\": 5250\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"警察？好的好的。\",\n    \"delay_ms\": 7150\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我是新加坡警察部队的陈警官，警号二零四七。\",\n    \"delay_ms\": 2500\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您已经涉及一宗刑事案件，如果今天不配合调查，可能会被逮捕。\",\n    \"delay_ms\": 5450\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我什么都没做过啊，我要怎么做？\",\n    \"delay_ms\": 6700\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"这件事绝对保密，不能告诉任何人，包括您的家人和银行。\",\n    \"delay_ms\": 4100\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"为了证明您的清白，我们需要核查您的资金，请把您的存款转到我们提供的安全账户。\",\n    \"delay_ms\": 6400\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"把存款全部转走？这样真的可以吗？\",\n    \"delay_ms\": 8750\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"必须现在就办，三十分钟内，否则法院会发出拘捕令。\",\n    \"delay_ms\": 4300\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"请打开手机银行，把钱转到这个账户，银行发来验证码时马上念给我听。\",\n    \"delay_ms\": 5950\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我有点害怕，我先找一下手机。\",\n    \"delay_ms\": 7350\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"不要挂电话，转账完成之前请一直保持通话。\",\n    \"delay_ms\": 3850\n  }\n]"
  scam_zh_12_parcel_customs.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您好，这里是快递公司。有一个以您名字寄出的包裹被海关扣留了。\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"包裹？我没有买什么东西啊。\",\n    \"delay_ms\": 6900\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"包裹是从海外寄来的，申报的内容和实际不符，所以被海关标记了。\",\n    \"delay_ms\": 3650\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"哦，那现在怎么办？\",\n    \"delay_ms\": 6900\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我现在帮您转接海关执法人员，请稍等。\",\n    \"delay_ms\": 2700\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您好，我是新加坡海关的林官员，您涉嫌进口违禁物品，现在正在被调查。\",\n    \"delay_ms\": 4800\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"违禁物品？我根本没订过那种东西。\",\n    \"delay_ms\": 7350\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"如果今天之内不处理，案件会移交给警方，包裹也会被销毁。\",\n    \"delay_ms\": 4300\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"那我该怎么处理？\",\n    \"delay_ms\": 6200\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您需要通过PayNow缴付四百八十元的放行费。\",\n    \"delay_ms\": 2700\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"PayNow？转给谁？\",\n    \"delay_ms\": 4400\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我马上把号码发给您，请在一小时内付款，否则罚款会加倍。\",\n    \"delay_ms\": 1800\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"付款后请把收据截图，用WhatsApp发给我。\",\n    \"delay_ms\": 6600\n  }\n]"
  scam_zh_20_ica_to_china_police.json: "[\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"您好，这里是新加坡移民与关卡局，我姓林。\",\n    \"delay_ms\": 1500\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"您好，有什么事吗？\",\n    \"delay_ms\": 2100\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我们发现有人用您的护照在上海办了一张电话卡，涉及洗钱案件。\",\n    \"delay_ms\": 1605\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我从来没有去过上海。\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"这个案子由中国警方负责，我现在帮您转接上海公安局的张警官。\",\n    \"delay_ms\": 1650\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"好的，我等一下。\",\n    \"delay_ms\": 2505\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"我是张警官。如果您今天不配合调查，我们会发出通缉令，您一出境就会被逮捕。\",\n    \"delay_ms\": 1560\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我真的什么都没做。\",\n    \"delay_ms\": 2820\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"为了证明您的清白，请马上把银行里的存款全部转到我们指定的安全账户。\",\n    \"delay_ms\": 1605\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"全部都要转吗？\",\n    \"delay_ms\": 2685\n  },\n  {\n    \"speaker\": \"caller\",\n    \"text\": \"对，现在就去转账，不要告诉银行职员和家人，这是保密调查。\",\n    \"delay_ms\": 1515\n  },\n  {\n    \"speaker\": \"receiver\",\n    \"text\": \"我想先问问我的家人。\",\n    \"delay_ms\": 2460\n  }\n]\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: scamguard
data:
  default.conf: "server {\n    listen 8080;\n    root /usr/share/nginx/html;\n    add_header Cache-Control \"no-cache\";\n    location / { index index.html; }\n    location /scripts/ { alias /usr/share/nginx/scripts/; autoindex on; autoindex_format json; }\n    location = /healthz { return 200 \"ok\"; }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scamguard
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      annotations:
        # a changed page or script changes this hash, so `kubectl apply` rolls the pod and it serves the new files
        scamguard/files-hash: "640c3aaaf32a"
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - { name: files, mountPath: /usr/share/nginx/html }
            - { name: scripts, mountPath: /usr/share/nginx/scripts }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: files, configMap: { name: web-files } }
        - { name: scripts, configMap: { name: web-scripts } }
        - { name: conf, configMap: { name: web-nginx } }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: scamguard
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: scamguard
spec:
  ingressClassName: nginx
  tls:
    - hosts: [scamguard.test]
      secretName: gateway-tls
  rules:
    - host: scamguard.test
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
