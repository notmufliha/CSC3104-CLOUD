# Generated by demo/make_monitoring.py -- edit that, not this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: scamguard
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    rule_files: [/etc/prometheus/rules.yml]
    scrape_configs:
      - job_name: aggregator
        dns_sd_configs:
          - names: [aggregator-hl.scamguard.svc.cluster.local]
            type: A
            port: 8082
      - job_name: review
        static_configs:
          - targets: [review.scamguard.svc.cluster.local:8090]
  rules.yml: |
    groups:
      - name: scamguard
        rules:
          # Shares over the short window, recorded so the baseline can average them over the long one.
          - record: scamguard:unsure_share:short
            expr: sum(rate(scamguard_lines_total{verdict="UNSURE"}[1h])) / sum(rate(scamguard_lines_total[1h]))
          - record: scamguard:disagreement_rate:short
            expr: sum(rate(scamguard_disagreements_total[1h])) / sum(rate(scamguard_bert_compared_total[1h]))
          - record: scamguard:lines_per_second:short
            expr: sum(rate(scamguard_lines_total[1h]))
          - alert: PossibleNewScam
            expr: |
              (
                scamguard:unsure_share:short > 1.5 * avg_over_time(scamguard:unsure_share:short[1d] offset 1h)
                and scamguard:unsure_share:short > 0.15
              )
              or
              (
                scamguard:disagreement_rate:short > 1.5 * avg_over_time(scamguard:disagreement_rate:short[1d] offset 1h)
                and scamguard:disagreement_rate:short > 0.1
              )
            for: 5m
            labels: { severity: info }
            annotations:
              summary: "More UNSURE answers or worker/BERT disagreement than usual: a new scam script may be circulating."
              action: "Check the review queue for reported calls; label them and run the retraining Job."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: scamguard
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
          ports:
            - containerPort: 9090
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: scamguard
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
