# Generated by demo/make_monitoring.py -- edit that, not this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: scamguard
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: scamguard
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
