apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
  namespace: scamguard
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: python:3.11-slim
          command: ["python", "/app/load_sim.py", "--url", "http://gateway:8080", "--scripts-dir", "/scripts"]
          env:
            - name: LOAD_USERS
              value: "30"
            - name: LOAD_DURATION
              value: "60"
            - name: LOAD_RAMP
              value: "10"
            - name: LOAD_PACE
              value: "10"
            - name: LOAD_SCAM_RATIO
              value: "0.5"
            - name: LOAD_ZH_RATIO
              value: "0.3"
            - name: LOAD_ERROR_THRESHOLD
              value: "0.05"
          volumeMounts:
            - name: script
              mountPath: /app
            - name: scripts
              mountPath: /scripts
          resources:
            requests: { cpu: "200m", memory: "128Mi" }
            limits: { cpu: "1", memory: "256Mi" }
      volumes:
        - name: script
          configMap:
            name: loadgen-script
        - name: scripts
          configMap:
            name: loadgen-scripts
