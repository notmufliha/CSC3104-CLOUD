apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: scamguard
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
# No persistence (no volume): call memory is temporary (TTL'd, see AGG_CALL_TTL_SECS) and fine to lose if
# this pod restarts -- that is in fact one of the things demo/chaos.sh demonstrates.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scamguard
spec:
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
