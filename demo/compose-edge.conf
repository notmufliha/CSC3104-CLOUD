# docker compose's "edge": the same job the Kubernetes Ingress does (demo/k8s/08-ingress.yaml + federated/), on plain
# HTTP port 8088 so a phone or the emulator has ONE address for everything:
#   http://<laptop IP>:8088/api/...    -> gateway (the app's calls)
#   http://<laptop IP>:8088/models/... -> model-service (on-device model downloads, Workstream G.10)
#   http://<laptop IP>:8088/fl/...     -> model-service (real-phone training uploads)
#   http://<laptop IP>:8088/           -> the ScamGuard web app (web/: the phone app in a browser, all three privacy
#                                         levels; this nginx is the scam/web image, web/Dockerfile)
# Save http://<laptop IP>:8088/api/ in the app (emulator: http://10.0.2.2:8088/api/).
server {
    listen 8088;
    client_max_body_size 10m;          # a phone's training upload is ~4 MB (gzip)

    location /api/ {
        proxy_pass http://gateway:8080/;   # /api/v1/utterance -> /v1/utterance
        proxy_read_timeout 5s;
    }
    location /models/ {
        proxy_pass http://model-service:8000;
    }
    location /fl/ {
        proxy_pass http://model-service:8000;
    }
    # The web app, the call scripts it plays (the Android app's own, listed as JSON for the page), and for privacy
    # levels 2 and 3 the apps' on-device models + onnxruntime-web (same paths as web/nginx.conf in Kubernetes)
    root /usr/share/nginx/html;
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location /ondevice/ {
        types { application/json json; text/plain txt; application/octet-stream onnx; }
        add_header Cache-Control "no-cache";
    }
    location /vendor/ {
        types { application/javascript js mjs; application/wasm wasm; }
        add_header Cache-Control "public, max-age=86400";
    }
    location /scripts/ {
        alias /usr/share/nginx/scripts/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
